<!DOCTYPE html>

<style>
  :root{
    --ink:#12242B;
    --teal:#0B6E67;
    --teal-dark:#084F4A;
    --bg:#F5F7F6;
    --panel:#FFFFFF;
    --border:#E1E6E4;
    --amber:#C97A2E;
    --danger:#B3432B;
    --muted:#5C6D6A;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0 0 8px 0;}
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:34px;height:34px;border-radius:8px;background:var(--teal); display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-weight:600; }
  .brand-name{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; letter-spacing:.2px;}
  .badge{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; background:var(--amber); color:#fff; padding:2px 7px; border-radius:5px; margin-left:8px; vertical-align:middle;}
  .tabs{ display:flex; gap:4px; flex-wrap:wrap; }
  .tab{ padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:500; color:var(--muted); font-size:14px; }
  .tab.active{ background:var(--teal); color:#fff; }
  .container{ max-width:1040px; margin:0 auto; padding:28px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:24px; margin-bottom:20px; }
  label{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  input, select{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:'Inter',sans-serif; background:#fff; color:var(--ink); }
  input:focus, select:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr auto; gap:16px; margin-bottom:16px; align-items:end; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 20px; border-radius:8px; border:none; cursor:pointer; font-weight:600; font-size:14px; background:var(--teal); color:#fff; transition:background .15s; }
  .btn:hover{ background:var(--teal-dark); }
  .btn.secondary{ background:transparent; color:var(--teal); border:1px solid var(--teal); }
  .btn.secondary:hover{ background:#EAF3F2; }
  .btn.danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); padding:6px 10px; font-size:12px; }
  .btn.small{ padding:6px 12px; font-size:12px; }
  .error{ background:#FBEAE5; border:1px solid #EAC3B5; color:var(--danger); padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; }
  .info{ background:#EAF3F2; border:1px solid #C7E0DD; color:var(--teal-dark); padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; }
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); }
  .auth-card{ width:380px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:32px; }
  .auth-switch{ text-align:center; margin-top:16px; font-size:13px; color:var(--muted); }
  .auth-switch a{ color:var(--teal); cursor:pointer; font-weight:600; text-decoration:none; }

  .dental-chart{ text-align:center; }
  .arch{ display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tooth{ width:34px; height:34px; border-radius:6px; border:1px solid var(--border); background:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; font-family:'IBM Plex Mono',monospace; color:var(--muted); transition:all .1s; }
  .tooth:hover{ border-color:var(--teal); }
  .tooth.selected{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .arch-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .midline{ width:0; border-left:1px dashed var(--border); margin:0 4px; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:8px; border-bottom:1px solid var(--border); }
  td{ padding:10px 8px; border-bottom:1px solid var(--border); }
  .total-row td{ font-weight:700; border-bottom:none; font-family:'IBM Plex Mono',monospace; }
  .role-pill{ font-size:11px; padding:2px 8px; border-radius:10px; text-transform:uppercase; letter-spacing:.04em; }
  .role-pill.admin{ background:var(--amber); color:#fff; }
  .role-pill.user{ background:var(--border); color:var(--muted); }

  .empty{ text-align:center; padding:40px 20px; color:var(--muted); }
  .print-area{ display:none; }

  @media print{
    body *{ visibility:hidden; }
    .print-area, .print-area *{ visibility:visible; }
    .print-area{ display:block; position:absolute; top:0; left:0; width:100%; padding:20px; }
    .print-header{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #12242B; padding-bottom:12px; margin-bottom:20px; }
    .print-teeth{ display:flex; flex-wrap:wrap; gap:6px; }
    .print-tooth{ border:1px solid #12242B; border-radius:4px; padding:4px 8px; font-family:monospace; font-size:13px; }
  }
</style>
</head>

<script type="text/babel">
const { useState, useEffect } = React;

// Listino di esempio, usato solo per inizializzare Firestore la prima volta (pulsante nel pannello Admin)
const SEED_PRICE_LIST = [
  { category: "Protesi fissa", name: "Corona in ceramica integrale", price: 180 },
  { category: "Protesi fissa", name: "Corona in metallo-ceramica", price: 140 },
  { category: "Protesi fissa", name: "Ponte 3 elementi", price: 420 },
  { category: "Protesi mobile", name: "Protesi totale superiore", price: 350 },
  { category: "Protesi mobile", name: "Protesi scheletrata", price: 480 },
  { category: "Ortodonzia", name: "Mascherina trasparente", price: 220 },
  { category: "Ortodonzia", name: "Apparecchio Herbst", price: 390 },
  { category: "Bite / Occlusione", name: "Bite in resina rigida", price: 120 },
  { category: "Bite / Occlusione", name: "Bite molle notturno", price: 90 },
];

const UPPER_RIGHT = [18,17,16,15,14,13,12,11];
const UPPER_LEFT  = [21,22,23,24,25,26,27,28];
const LOWER_LEFT  = [31,32,33,34,35,36,37,38];
const LOWER_RIGHT = [48,47,46,45,44,43,42,41];

function DentalChart({ selected, onToggle }) {
  const renderArch = (left, right) => (
    <div className="arch">
      {left.map(n => (<div key={n} className={"tooth" + (selected.includes(n) ? " selected" : "")} onClick={() => onToggle(n)}>{n}</div>))}
      <div className="midline"></div>
      {right.map(n => (<div key={n} className={"tooth" + (selected.includes(n) ? " selected" : "")} onClick={() => onToggle(n)}>{n}</div>))}
    </div>
  );
  return (
    <div className="dental-chart">
      <div className="arch-label">Arcata superiore</div>
      {renderArch(UPPER_RIGHT, UPPER_LEFT)}
      <div className="arch-label" style={{marginTop:14}}>Arcata inferiore</div>
      {renderArch(LOWER_RIGHT, LOWER_LEFT)}
    </div>
  );
}

function traduciErrore(code) {
  const map = {
    "auth/invalid-email": "Email non valida.",
    "auth/user-not-found": "Utente non trovato.",
    "auth/wrong-password": "Password errata.",
    "auth/email-already-in-use": "Email già registrata.",
    "auth/weak-password": "La password deve avere almeno 6 caratteri.",
    "auth/invalid-credential": "Credenziali non valide.",
  };
  return map[code] || "Si è verificato un errore. Riprova.";
}

function AuthScreen() {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setLoading(true);
    try {
      if (mode === "login") {
        await auth.signInWithEmailAndPassword(email, password);
      } else {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        // Crea il profilo utente in Firestore (ruolo predefinito: "user")
        await db.collection("users").doc(cred.user.uid).set({
          email: cred.user.email,
          role: "user",
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
    } catch (err) {
      setError(traduciErrore(err.code));
    }
    setLoading(false);
  };

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="brand" style={{marginBottom:24, justifyContent:"center"}}>
          <div className="brand-mark">G</div>
          <div className="brand-name">GesPro</div>
        </div>
        <h2 style={{textAlign:"center", fontSize:18}}>{mode === "login" ? "Accedi" : "Crea un account"}</h2>
        {error && <div className="error">{error}</div>}
        <form onSubmit={submit}>
          <label>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required style={{marginBottom:14}} />
          <label>Password</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required minLength={6} style={{marginBottom:20}} />
          <button className="btn" type="submit" style={{width:"100%"}} disabled={loading}>
            {loading ? "Attendere..." : (mode === "login" ? "Accedi" : "Registrati")}
          </button>
        </form>
        <div className="auth-switch">
          {mode === "login" ? (
            <span>Non hai un account? <a onClick={()=>{setMode("register"); setError("");}}>Registrati</a></span>
          ) : (
            <span>Hai già un account? <a onClick={()=>{setMode("login"); setError("");}}>Accedi</a></span>
          )}
        </div>
      </div>
    </div>
  );
}

function NewPrescription({ user, priceList, onSaved }) {
  const categories = [...new Set(priceList.map(i => i.category))];
  const [patient, setPatient] = useState({ nome:"", cognome:"", dataNascita:"" });
  const [teeth, setTeeth] = useState([]);
  const [category, setCategory] = useState(categories[0] || "");
  const [selectedItem, setSelectedItem] = useState("");
  const [lines, setLines] = useState([]);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    const items = priceList.filter(i => i.category === category);
    setSelectedItem(items[0] ? items[0].name : "");
  }, [category, priceList]);

  const toggleTooth = (n) => setTeeth(t => t.includes(n) ? t.filter(x=>x!==n) : [...t, n].sort((a,b)=>a-b));
  const currentCategoryItems = priceList.filter(i => i.category === category);

  const addLine = () => {
    const item = priceList.find(i => i.category === category && i.name === selectedItem);
    if (item) setLines(l => [...l, { category: item.category, name: item.name, price: item.price }]);
  };
  const removeLine = (idx) => setLines(l => l.filter((_,i)=>i!==idx));
  const total = lines.reduce((s,l)=>s+l.price, 0);
  const canSave = patient.nome && patient.cognome && lines.length > 0;

  const save = async () => {
    setError("");
    if (!canSave) { setError("Compila nome, cognome paziente e aggiungi almeno un dispositivo."); return; }
    setSaving(true);
    try {
      await db.collection("prescriptions").add({
        ownerId: user.uid, ownerEmail: user.email,
        patient, teeth, lines, total,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      onSaved();
    } catch (err) {
      setError("Errore nel salvataggio: " + err.message);
    }
    setSaving(false);
  };

  const doPrint = () => {
    if (!canSave) { setError("Compila nome, cognome paziente e aggiungi almeno un dispositivo prima di stampare."); return; }
    window.print();
  };

  if (priceList.length === 0) {
    return <div className="card"><div className="info">Il listino è vuoto. Chiedi a un amministratore di aggiungere i dispositivi nel pannello "Amministrazione".</div></div>;
  }

  return (
    <div>
      <div className="card">
        <h3>Dati paziente</h3>
        {error && <div className="error">{error}</div>}
        <div className="row">
          <div><label>Nome</label><input value={patient.nome} onChange={e=>setPatient({...patient, nome:e.target.value})} /></div>
          <div><label>Cognome</label><input value={patient.cognome} onChange={e=>setPatient({...patient, cognome:e.target.value})} /></div>
        </div>
        <div style={{maxWidth:240}}>
          <label>Data di nascita</label>
          <input type="date" value={patient.dataNascita} onChange={e=>setPatient({...patient, dataNascita:e.target.value})} />
        </div>
      </div>

      <div className="card">
        <h3>Schema dentale</h3>
        <p style={{fontSize:13, color:"var(--muted)", marginTop:0}}>Seleziona i denti coinvolti (numerazione FDI/ISO).</p>
        <DentalChart selected={teeth} onToggle={toggleTooth} />
      </div>

      <div className="card">
        <h3>Dispositivo da realizzare</h3>
        <div className="row">
          <div>
            <label>Categoria</label>
            <select value={category} onChange={e=>setCategory(e.target.value)}>
              {categories.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label>Dispositivo</label>
            <select value={selectedItem} onChange={e=>setSelectedItem(e.target.value)}>
              {currentCategoryItems.map(i => <option key={i.id} value={i.name}>{i.name} — €{i.price}</option>)}
            </select>
          </div>
        </div>
        <button className="btn secondary" onClick={addLine} type="button">+ Aggiungi alla prescrizione</button>

        {lines.length > 0 && (
          <table style={{marginTop:18}}>
            <thead><tr><th>Categoria</th><th>Dispositivo</th><th>Prezzo</th><th></th></tr></thead>
            <tbody>
              {lines.map((l, idx) => (
                <tr key={idx}>
                  <td>{l.category}</td><td>{l.name}</td><td className="mono">€{l.price.toFixed(2)}</td>
                  <td><button className="btn danger" onClick={()=>removeLine(idx)} type="button">Rimuovi</button></td>
                </tr>
              ))}
              <tr className="total-row"><td colSpan="2">Totale</td><td className="mono">€{total.toFixed(2)}</td><td></td></tr>
            </tbody>
          </table>
        )}
      </div>

      <div style={{display:"flex", gap:12}}>
        <button className="btn" onClick={save} disabled={saving}>{saving ? "Salvataggio..." : "Salva prescrizione"}</button>
        <button className="btn secondary" onClick={doPrint} type="button">Stampa / Salva PDF</button>
      </div>

      <div className="print-area">
        <div className="print-header">
          <div><h2 style={{margin:0}}>GesPro</h2><div style={{fontSize:12, color:"#555"}}>Prescrizione per laboratorio odontotecnico</div></div>
          <div style={{fontSize:12}}>{new Date().toLocaleDateString("it-IT")}</div>
        </div>
        <h3>Paziente</h3>
        <p>{patient.nome} {patient.cognome}{patient.dataNascita ? " — nato/a il " + new Date(patient.dataNascita).toLocaleDateString("it-IT") : ""}</p>
        <h3>Denti coinvolti</h3>
        <div className="print-teeth">
          {teeth.length ? teeth.map(t => <div key={t} className="print-tooth">{t}</div>) : <em>Nessun dente selezionato</em>}
        </div>
        <h3 style={{marginTop:20}}>Dispositivi richiesti</h3>
        <table>
          <thead><tr><th>Categoria</th><th>Dispositivo</th><th>Prezzo</th></tr></thead>
          <tbody>
            {lines.map((l, idx) => (<tr key={idx}><td>{l.category}</td><td>{l.name}</td><td>€{l.price.toFixed(2)}</td></tr>))}
            <tr className="total-row"><td colSpan="2">Totale</td><td>€{total.toFixed(2)}</td></tr>
          </tbody>
        </table>
        <div style={{marginTop:60}}>_____________________<br/><small>Firma</small></div>
      </div>
    </div>
  );
}

function PrescriptionList({ user }) {
  const [items, setItems] = useState(null);
  useEffect(() => {
    db.collection("prescriptions").where("ownerId", "==", user.uid)
      .orderBy("createdAt", "desc").get().then(snap => {
        setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      });
  }, []);
  if (items === null) return <div className="empty">Caricamento...</div>;
  if (items.length === 0) return <div className="empty">Nessuna prescrizione ancora salvata.</div>;
  return (
    <div className="card">
      <table>
        <thead><tr><th>Data</th><th>Paziente</th><th>Dispositivi</th><th>Totale</th></tr></thead>
        <tbody>
          {items.map(p => (
            <tr key={p.id}>
              <td>{p.createdAt ? new Date(p.createdAt.seconds*1000).toLocaleDateString("it-IT") : "—"}</td>
              <td>{p.patient.nome} {p.patient.cognome}</td>
              <td>{p.lines.map(l=>l.name).join(", ")}</td>
              <td className="mono">€{p.total.toFixed(2)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ============ PANNELLO AMMINISTRAZIONE ============
function AdminPriceList({ priceList, reload }) {
  const categories = [...new Set(priceList.map(i => i.category))];
  const [form, setForm] = useState({ category:"", name:"", price:"" });
  const [saving, setSaving] = useState(false);

  const addItem = async () => {
    if (!form.category || !form.name || !form.price) return;
    setSaving(true);
    await db.collection("priceList").add({ category: form.category, name: form.name, price: parseFloat(form.price) });
    setForm({ category:"", name:"", price:"" });
    await reload();
    setSaving(false);
  };
  const removeItem = async (id) => { await db.collection("priceList").doc(id).delete(); await reload(); };

  const seed = async () => {
    setSaving(true);
    const batch = db.batch();
    SEED_PRICE_LIST.forEach(item => { const ref = db.collection("priceList").doc(); batch.set(ref, item); });
    await batch.commit();
    await reload();
    setSaving(false);
  };

  return (
    <div className="card">
      <h3>Listino prezzi</h3>
      {priceList.length === 0 && (
        <div className="info">Il listino è vuoto. <a style={{cursor:"pointer", fontWeight:600}} onClick={seed}>Inizializza con un listino di esempio</a>, poi modifica liberamente le voci.</div>
      )}
      <div className="row3">
        <div><label>Categoria</label><input list="cat-list" value={form.category} onChange={e=>setForm({...form, category:e.target.value})} placeholder="Es. Protesi fissa" />
          <datalist id="cat-list">{categories.map(c => <option key={c} value={c} />)}</datalist>
        </div>
        <div><label>Nome dispositivo</label><input value={form.name} onChange={e=>setForm({...form, name:e.target.value})} placeholder="Es. Corona in ceramica" /></div>
        <div style={{display:"flex", gap:8}}>
          <div style={{width:100}}><label>Prezzo €</label><input type="number" value={form.price} onChange={e=>setForm({...form, price:e.target.value})} /></div>
          <button className="btn" style={{height:42, alignSelf:"end"}} onClick={addItem} disabled={saving} type="button">+ Aggiungi</button>
        </div>
      </div>
      <table>
        <thead><tr><th>Categoria</th><th>Dispositivo</th><th>Prezzo</th><th></th></tr></thead>
        <tbody>
          {priceList.map(i => (
            <tr key={i.id}>
              <td>{i.category}</td><td>{i.name}</td><td className="mono">€{i.price.toFixed(2)}</td>
              <td><button className="btn danger" onClick={()=>removeItem(i.id)} type="button">Rimuovi</button></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function AdminAllPrescriptions() {
  const [items, setItems] = useState(null);
  useEffect(() => {
    db.collection("prescriptions").orderBy("createdAt", "desc").get().then(snap => {
      setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
  }, []);
  if (items === null) return <div className="empty">Caricamento...</div>;
  if (items.length === 0) return <div className="empty">Nessuna prescrizione nel sistema.</div>;
  return (
    <div className="card">
      <h3>Tutte le prescrizioni</h3>
      <table>
        <thead><tr><th>Data</th><th>Utente</th><th>Paziente</th><th>Dispositivi</th><th>Totale</th></tr></thead>
        <tbody>
          {items.map(p => (
            <tr key={p.id}>
              <td>{p.createdAt ? new Date(p.createdAt.seconds*1000).toLocaleDateString("it-IT") : "—"}</td>
              <td>{p.ownerEmail}</td>
              <td>{p.patient.nome} {p.patient.cognome}</td>
              <td>{p.lines.map(l=>l.name).join(", ")}</td>
              <td className="mono">€{p.total.toFixed(2)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function AdminUsers({ currentUid }) {
  const [users, setUsers] = useState(null);
  const load = async () => {
    const snap = await db.collection("users").orderBy("createdAt", "desc").get();
    setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  };
  useEffect(() => { load(); }, []);

  const toggleRole = async (u) => {
    const newRole = u.role === "admin" ? "user" : "admin";
    await db.collection("users").doc(u.id).update({ role: newRole });
    load();
  };

  if (users === null) return <div className="empty">Caricamento...</div>;
  return (
    <div className="card">
      <h3>Utenti registrati</h3>
      <table>
        <thead><tr><th>Email</th><th>Ruolo</th><th>Registrato il</th><th></th></tr></thead>
        <tbody>
          {users.map(u => (
            <tr key={u.id}>
              <td>{u.email}</td>
              <td><span className={"role-pill " + (u.role === "admin" ? "admin" : "user")}>{u.role}</span></td>
              <td>{u.createdAt ? new Date(u.createdAt.seconds*1000).toLocaleDateString("it-IT") : "—"}</td>
              <td>
                {u.id !== currentUid && (
                  <button className="btn secondary small" onClick={()=>toggleRole(u)} type="button">
                    {u.role === "admin" ? "Rendi utente normale" : "Rendi amministratore"}
                  </button>
                )}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function AdminPanel({ user, priceList, reloadPriceList }) {
  const [sub, setSub] = useState("listino");
  return (
    <div>
      <div className="tabs" style={{marginBottom:16}}>
        <div className={"tab" + (sub==="listino" ? " active" : "")} onClick={()=>setSub("listino")}>Listino</div>
        <div className={"tab" + (sub==="prescrizioni" ? " active" : "")} onClick={()=>setSub("prescrizioni")}>Tutte le prescrizioni</div>
        <div className={"tab" + (sub==="utenti" ? " active" : "")} onClick={()=>setSub("utenti")}>Utenti</div>
      </div>
      {sub === "listino" && <AdminPriceList priceList={priceList} reload={reloadPriceList} />}
      {sub === "prescrizioni" && <AdminAllPrescriptions />}
      {sub === "utenti" && <AdminUsers currentUid={user.uid} />}
    </div>
  );
}

// ============ APP PRINCIPALE ============
function App() {
  const [user, setUser] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [tab, setTab] = useState("new");
  const [refreshKey, setRefreshKey] = useState(0);
  const [priceList, setPriceList] = useState([]);

  const loadPriceList = async () => {
    const snap = await db.collection("priceList").orderBy("category").get();
    setPriceList(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  };

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        const doc = await db.collection("users").doc(u.uid).get();
        setProfile(doc.exists ? doc.data() : { role: "user" });
        loadPriceList();
      } else {
        setProfile(null);
      }
    });
    return unsub;
  }, []);

  if (user === undefined) return <div className="empty">Caricamento...</div>;
  if (user === null) return <AuthScreen />;

  const isAdmin = profile && profile.role === "admin";

  return (
    <div>
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">G</div>
          <div className="brand-name">GesPro</div>
          {isAdmin && <span className="badge">Admin</span>}
        </div>
        <div className="tabs">
          <div className={"tab" + (tab==="new" ? " active" : "")} onClick={()=>setTab("new")}>Nuova prescrizione</div>
          <div className={"tab" + (tab==="list" ? " active" : "")} onClick={()=>{setTab("list"); setRefreshKey(k=>k+1);}}>Elenco prescrizioni</div>
          {isAdmin && <div className={"tab" + (tab==="admin" ? " active" : "")} onClick={()=>setTab("admin")}>Amministrazione</div>}
        </div>
        <button className="btn secondary" onClick={()=>auth.signOut()}>Esci</button>
      </div>
      <div className="container">
        {tab === "new" && <NewPrescription user={user} priceList={priceList} onSaved={()=>{ setTab("list"); setRefreshKey(k=>k+1); }} />}
        {tab === "list" && <PrescriptionList key={refreshKey} user={user} />}
        {tab === "admin" && isAdmin && <AdminPanel user={user} priceList={priceList} reloadPriceList={loadPriceList} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
