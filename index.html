function generatePassword() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  let out = "";
  for (let i = 0; i < 10; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

// Crea automaticamente un listino per il codice utente indicato, se non ne esiste già uno con quel codice
async function ensureListinoForUser(codiceUtente, nome) {
  if (!codiceUtente) return;
  const snap = await db.collection("listini").where("codice", "==", codiceUtente).limit(1).get();
  if (!snap.empty) return; // esiste già un listino con questo codice, non ne creo un altro
  await db.collection("listini").add({
    nome: nome || codiceUtente,
    codice: codiceUtente,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });
}

function nominativoDaAnagrafica(anagrafica) {
  if (anagrafica.tipo === "azienda") return anagrafica.ragioneSociale || "";
  return `${anagrafica.nome || ""} ${anagrafica.cognome || ""}`.trim();
}

async function createUserAsAdmin(email, password, role, codiceUtente, anagrafica) {
  let secondaryApp;
  try {
    secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary-" + Date.now());
    const secondaryAuth = secondaryApp.auth();
    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    await db.collection("users").doc(cred.user.uid).set({
      email, role, codiceUtente: codiceUtente || "",
      tipoAnagrafica: anagrafica.tipo, nome: anagrafica.nome || "", cognome: anagrafica.cognome || "", ragioneSociale: anagrafica.ragioneSociale || "",
      indirizzo: anagrafica.indirizzo || "", piva: anagrafica.piva || "", telefono: anagrafica.telefono || "", logoDataUrl: anagrafica.logoDataUrl || "",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    await ensureListinoForUser(codiceUtente, nominativoDaAnagrafica(anagrafica));
    await secondaryAuth.signOut();
    await secondaryApp.delete();
    return { success: true };
  } catch (err) {
    if (secondaryApp) { try { await secondaryApp.delete(); } catch(e){} }
    return { success: false, error: err.code };
  }
}

// Genera un codice prescrizione univoco e progressivo tipo RX-2026-0001, tramite contatore transazionale
async function generatePrescriptionCode() {
  const year = new Date().getFullYear();
  const counterRef = db.collection("counters").doc("prescriptions_" + year);
  const nextNumber = await db.runTransaction(async (tx) => {
    const doc = await tx.get(counterRef);
    const current = doc.exists ? doc.data().value : 0;
    const next = current + 1;
    tx.set(counterRef, { value: next }, { merge: true });
    return next;
  });
  return "RX-" + year + "-" + String(nextNumber).padStart(4, "0");
}

function traduciErrore(code) {
  const map = {
    "auth/invalid-email": "Email non valida.",
    "auth/user-not-found": "Utente non trovato. Chiedi all'amministratore di crearti un account.",
    "auth/wrong-password": "Password errata.",
    "auth/email-already-in-use": "Email già registrata.",
    "auth/weak-password": "La password deve avere almeno 6 caratteri.",
    "auth/invalid-credential": "Credenziali non valide.",
  };
  return map[code] || "Si è verificato un errore. Riprova.";
}

// ============ ICONE DENTI (per tipo anatomico) ============
function toothType(n) {
  const pos = n % 10;
  if (pos <= 2) return "incisor";
  if (pos === 3) return "canine";
  if (pos <= 5) return "premolar";
  return "molar";
}

const TOOTH_PATHS = {
  incisor: "M9 3 L15 3 Q17 3 16.5 7 L15.5 18 Q15.2 25 12 25 Q8.8 25 8.5 18 L7.5 7 Q7 3 9 3 Z",
  canine: "M12 2 L17 8 Q18.5 11 16.5 15 L15.5 19 Q15 25 12 25 Q9 25 8.5 19 L7.5 15 Q5.5 11 7 8 Z",
  premolar: "M6.5 8 Q7 3 9.5 5.5 Q11 2.5 12 5 Q13 2.5 14.5 5.5 Q17 3 17.5 8 L16.5 18 Q16 25 12 25 Q8 25 7.5 18 Z",
  molar: "M4 9 Q4.5 3 7 5.5 Q9 2.5 10.5 5 Q12 2.5 13.5 5 Q15 2.5 17 5.5 Q19.5 3 20 9 L19 19 Q18.5 25 12 25 Q5.5 25 5 19 Z",
};

function ToothIcon({ type }) {
  return (
    <svg viewBox="0 0 24 28" xmlns="http://www.w3.org/2000/svg">
      <path className="tooth-shape" d={TOOTH_PATHS[type]} />
    </svg>
  );
}

function DentalChart({ selected, onToggle }) {
  const renderArch = (left, right) => (
    <div className="arch">
      {left.map(n => (
        <button key={n} type="button" className={"tooth-btn" + (selected.includes(n) ? " selected" : "")} onClick={() => onToggle(n)}>
          <ToothIcon type={toothType(n)} /><span className="tooth-num">{n}</span>
        </button>
      ))}
      <div className="midline"></div>
      {right.map(n => (
        <button key={n} type="button" className={"tooth-btn" + (selected.includes(n) ? " selected" : "")} onClick={() => onToggle(n)}>
          <ToothIcon type={toothType(n)} /><span className="tooth-num">{n}</span>
        </button>
      ))}
    </div>
  );
  return (
    <div className="dental-chart">
      <div className="arch-label">Arcata superiore</div>
      {renderArch(UPPER_RIGHT, UPPER_LEFT)}
      <div className="arch-label" style={{marginTop:14}}>Arcata inferiore</div>
      {renderArch(LOWER_RIGHT, LOWER_LEFT)}
      <div className="legend">
        <span><ToothIcon type="incisor" />Incisivo</span>
        <span><ToothIcon type="canine" />Canino</span>
        <span><ToothIcon type="premolar" />Premolare</span>
        <span><ToothIcon type="molar" />Molare</span>
      </div>
    </div>
  );
}

function AuthScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (err) {
      setError(traduciErrore(err.code));
    }
    setLoading(false);
  };

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="brand" style={{marginBottom:24, justifyContent:"center"}}>
          <div className="brand-mark">G</div>
          <div className="brand-name">GesPro</div>
        </div>
        <h2 style={{textAlign:"center", fontSize:18}}>Accedi</h2>
        {error && <div className="error">{error}</div>}
        <form onSubmit={submit}>
          <label>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required style={{marginBottom:14}} />
          <label>Password</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required style={{marginBottom:20}} />
          <button className="btn" type="submit" style={{width:"100%"}} disabled={loading}>
            {loading ? "Attendere..." : "Accedi"}
          </button>
        </form>
        <div className="auth-note">Non hai un account? Comunica la tua email all'amministratore, che te ne creerà uno.</div>
      </div>
    </div>
  );
}

  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (next !== confirm) { setError("Le due password non coincidono."); return; }
    setLoading(true);
    try {
      const user = auth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, current);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(next);
      setOk(true);
    } catch (err) {
      setError(traduciErrore(err.code));
    }
    setLoading(false);
  };

  return (
    <div className="card">
      <h3>Cambia password</h3>
      {ok ? (
        <div className="success">Password aggiornata correttamente. <a style={{cursor:"pointer", fontWeight:600}} onClick={onClose}>Chiudi</a></div>
      ) : (
        <form onSubmit={submit}>
          {error && <div className="error">{error}</div>}
          <div style={{maxWidth:300, marginBottom:16}}>
            <label>Password attuale</label><input type="password" value={current} onChange={e=>setCurrent(e.target.value)} required />
          </div>
          <div className="row">
            <div><label>Nuova password</label><input type="password" value={next} onChange={e=>setNext(e.target.value)} required minLength={6} /></div>
            <div><label>Conferma nuova password</label><input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} required minLength={6} /></div>
          </div>
          <div style={{display:"flex", gap:10}}>
            <button className="btn" type="submit" disabled={loading}>{loading ? "Attendere..." : "Aggiorna password"}</button>
            <button className="btn secondary" type="button" onClick={onClose}>Annulla</button>
          </div>
        </form>
      )}
    </div>
  );
}

function NewPrescription({ user, profile, catalog, onSaved, isAdmin, usersList }) {
  const [effectiveCatalog, setEffectiveCatalog] = useState(catalog);
  const [listinoAttivo, setListinoAttivo] = useState(null);
  const categories = [...new Set(effectiveCatalog.map(i => i.category))];
  const [patient, setPatient] = useState({ nome:"", cognome:"", dataNascita:"" });
  const [teeth, setTeeth] = useState([]);
  const [category, setCategory] = useState(categories[0] || "");
  const [selectedCode, setSelectedCode] = useState("");
  const [lines, setLines] = useState([]);
  const [anamnesi, setAnamnesi] = useState(DEFAULT_ANAMNESI);
  const [eta, setEta] = useState("");
  const [sesso, setSesso] = useState("");
  const [formaViso, setFormaViso] = useState("");
  const [descrizioneDispositivo, setDescrizioneDispositivo] = useState("");
  const [materiale, setMateriale] = useState(MATERIALI[0]);
  const [materialeAltro, setMaterialeAltro] = useState("");
  const [materialeAllegato, setMaterialeAllegato] = useState([]);
  const [impronte, setImpronte] = useState({ data:"", disinfettateCon:"", materialeUtilizzato:"" });
  const [colore, setColore] = useState("");
  const [campionario, setCampionario] = useState("");
  const [perContoDi, setPerContoDi] = useState(""); // uid dell'utente selezionato dall'admin, vuoto = se stesso
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [savedCode, setSavedCode] = useState(null);

  // Risolve il listino del cliente in base al suo codice utente; se non trovato, usa il catalogo generico
  useEffect(() => {
    let cancelled = false;
    async function resolveCatalog() {
      const targetUser = perContoDi ? usersList.find(u => u.id === perContoDi) : null;
      const codiceUtente = targetUser ? targetUser.codiceUtente : (profile && profile.codiceUtente);
      if (!codiceUtente) { if (!cancelled) { setEffectiveCatalog(catalog); setListinoAttivo(null); } return; }
      try {
        const snap = await db.collection("listini").where("codice", "==", codiceUtente).limit(1).get();
        if (snap.empty) { if (!cancelled) { setEffectiveCatalog(catalog); setListinoAttivo(null); } return; }
        const listinoDoc = snap.docs[0];
        const itemsSnap = await db.collection("listini").doc(listinoDoc.id).collection("lavorazioni").orderBy("category").get();
        if (itemsSnap.empty) { if (!cancelled) { setEffectiveCatalog(catalog); setListinoAttivo(null); } return; }
        if (!cancelled) {
          setEffectiveCatalog(itemsSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setListinoAttivo({ id: listinoDoc.id, ...listinoDoc.data() });
        }
      } catch (err) {
        if (!cancelled) { setEffectiveCatalog(catalog); setListinoAttivo(null); }
      }
    }
    resolveCatalog();
    return () => { cancelled = true; };
  }, [perContoDi, catalog, profile, usersList]);

  useEffect(() => {
    const items = effectiveCatalog.filter(i => i.category === category);
    setSelectedCode(items[0] ? items[0].code : "");
  }, [category, effectiveCatalog]);

  const toggleTooth = (n) => setTeeth(t => t.includes(n) ? t.filter(x=>x!==n) : [...t, n].sort((a,b)=>a-b));
  const currentCategoryItems = effectiveCatalog.filter(i => i.category === category);

  const addLine = () => {
    const item = effectiveCatalog.find(i => i.category === category && i.code === selectedCode);
    if (item) setLines(l => [...l, {
      category: item.category, code: item.code, description: item.description,
      codiceCliente: item.codiceCliente || "", descrizionePersonalizzata: item.descrizionePersonalizzata || "",
    }]);
  };
  const removeLine = (idx) => setLines(l => l.filter((_,i)=>i!==idx));

  const toggleAnamnesi = (key) => {
    setAnamnesi(a => {
      if (key === "nullaDaSegnalare") {
        return { ...DEFAULT_ANAMNESI };
      }
      const updated = { ...a, [key]: !a[key], nullaDaSegnalare: false };
      return updated;
    });
  };
  const anamnesiNeedsNote = ANAMNESI_OPTIONS.some(o => anamnesi[o.key]);

  const toggleAllegato = (opt) => {
    setMaterialeAllegato(list => list.includes(opt) ? list.filter(x=>x!==opt) : [...list, opt]);
  };

  const canSave = patient.nome && patient.cognome && lines.length > 0;

  const save = async () => {
    setError("");
    if (!canSave) { setError("Compila nome, cognome paziente e aggiungi almeno un dispositivo."); return; }
    setSaving(true);
    try {
      const code = await generatePrescriptionCode();
      const targetUser = perContoDi ? usersList.find(u => u.id === perContoDi) : null;
      const ownerProfile = targetUser || profile || {};
      const clientHeader = {
        nominativo: ownerProfile.tipoAnagrafica === "azienda"
          ? (ownerProfile.ragioneSociale || "")
          : `${ownerProfile.nome || ""} ${ownerProfile.cognome || ""}`.trim(),
        indirizzo: ownerProfile.indirizzo || "",
        piva: ownerProfile.piva || "",
        telefono: ownerProfile.telefono || "",
        logoDataUrl: ownerProfile.logoDataUrl || "",
      };
      await db.collection("prescriptions").add({
        code,
        ownerId: targetUser ? targetUser.id : user.uid,
        ownerEmail: targetUser ? targetUser.email : user.email,
        createdBy: user.uid, createdByEmail: user.email, // traccia chi ha materialmente compilato la prescrizione
        clientHeader,
        patient, teeth, lines,
        anamnesi,
        altreInfo: { eta, sesso, formaViso },
        descrizioneDispositivo,
        materiale: materiale === "Altro" ? materialeAltro : materiale,
        materialeAllegato,
        impronte,
        colore, campionario,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setSavedCode(code);
      onSaved();
    } catch (err) {
      setError("Errore nel salvataggio: " + err.message);
    }
    setSaving(false);
  };

  const doPrint = () => {
    if (!canSave) { setError("Compila nome, cognome paziente e aggiungi almeno un dispositivo prima di stampare."); return; }
    window.print();
  };

  if (effectiveCatalog.length === 0) {
    return <div className="card"><div className="info">{listinoAttivo ? `Il listino "${listinoAttivo.nome}" è vuoto.` : "Il catalogo è vuoto."} Chiedi a un amministratore di aggiungere i dispositivi nel pannello "Amministrazione".</div></div>;
  }

  return (
    <div>
      {isAdmin && (
        <div className="card">
          <h3>Per conto di</h3>
          <p style={{fontSize:13, color:"var(--muted)", marginTop:-6}}>
            Stai compilando come amministratore. Se questa prescrizione è per un utente specifico, selezionalo qui sotto: comparirà nel suo elenco personale, non nel tuo.
          </p>
          <div style={{maxWidth:340}}>
            <label>Utente</label>
            <select value={perContoDi} onChange={e=>setPerContoDi(e.target.value)}>
              <option value="">Me stesso ({user.email})</option>
              {usersList.filter(u=>u.id !== user.uid).map(u => (
                <option key={u.id} value={u.id}>{nominativo(u)} — {u.email}</option>
              ))}
            </select>
          </div>
        </div>
      )}
      <div className="card">
        <h3>Dati paziente</h3>
        {error && <div className="error">{error}</div>}
        <div className="row">
          <div><label>Nome</label><input value={patient.nome} onChange={e=>setPatient({...patient, nome:e.target.value})} /></div>
          <div><label>Cognome</label><input value={patient.cognome} onChange={e=>setPatient({...patient, cognome:e.target.value})} /></div>
        </div>
        <div style={{maxWidth:240}}>
          <label>Data di nascita</label>
          <input type="date" value={patient.dataNascita} onChange={e=>setPatient({...patient, dataNascita:e.target.value})} />
        </div>
      </div>

      <div className="card">
        <h3>Anamnesi</h3>
        <div className="checkbox-row">
          <input type="checkbox" checked={anamnesi.nullaDaSegnalare} onChange={()=>toggleAnamnesi("nullaDaSegnalare")} />
          <label style={{margin:0, fontWeight:700, color:"var(--ink)"}}>Nulla da segnalare</label>
        </div>
        <div className="checkbox-grid">
          {ANAMNESI_OPTIONS.map(o => (
            <div className="checkbox-row" key={o.key}>
              <input type="checkbox" checked={anamnesi[o.key]} onChange={()=>toggleAnamnesi(o.key)} />
              <label style={{margin:0, fontWeight:400, color:"var(--ink)"}}>{o.label}</label>
            </div>
          ))}
        </div>
        {anamnesiNeedsNote && (
          <div style={{marginTop:10}}>
            <label>Specifica</label>
            <textarea value={anamnesi.note} onChange={e=>setAnamnesi({...anamnesi, note:e.target.value})} placeholder="Dettagli su quanto selezionato sopra..." />
          </div>
        )}
      </div>

      <div className="card">
        <h3>Altre informazioni</h3>
        <div className="row-auto">
          <div><label>Età</label><input type="number" min="0" value={eta} onChange={e=>setEta(e.target.value)} /></div>
          <div>
            <label>Sesso</label>
            <div style={{display:"flex", gap:8}}>
              <button type="button" className={"btn " + (sesso==="M" ? "" : "secondary")} onClick={()=>setSesso("M")} style={{flex:1}}>M</button>
              <button type="button" className={"btn " + (sesso==="F" ? "" : "secondary")} onClick={()=>setSesso("F")} style={{flex:1}}>F</button>
            </div>
          </div>
        </div>
        <label>Forma del viso</label>
        <div className="icon-choice-group">
          {["quadrato","tondo","triangolare"].map(shape => (
            <div key={shape} className={"icon-choice" + (formaViso===shape ? " selected" : "")} onClick={()=>setFormaViso(shape)}>
              <FaceIcon shape={shape} />
              {shape}
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <h3>Schema dentale</h3>
        <p style={{fontSize:13, color:"var(--muted)", marginTop:0}}>Seleziona i denti coinvolti (numerazione FDI/ISO).</p>
        <DentalChart selected={teeth} onToggle={toggleTooth} />
      </div>

      <div className="card">
        <h3>Dispositivo da realizzare</h3>
        {listinoAttivo && <p style={{fontSize:13, color:"var(--teal-dark)", marginTop:-6}}>Stai usando il listino dedicato "{listinoAttivo.nome}".</p>}
        <div className="row">
          <div>
            <label>Categoria</label>
            <select value={category} onChange={e=>setCategory(e.target.value)}>
              {categories.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label>Dispositivo</label>
            <select value={selectedCode} onChange={e=>setSelectedCode(e.target.value)}>
              {currentCategoryItems.map(i => <option key={i.id} value={i.code}>{itemLabel(i)}</option>)}
            </select>
          </div>
        </div>
        {(() => {
          const selectedItem = currentCategoryItems.find(i => i.code === selectedCode);
          if (!selectedItem || (!selectedItem.note && !selectedItem.imageDataUrl)) return null;
          return (
            <div className="info" style={{display:"flex", gap:12, alignItems:"flex-start"}}>
              {selectedItem.imageDataUrl && <img src={selectedItem.imageDataUrl} alt="" style={{width:70, height:70, objectFit:"cover", borderRadius:8, flexShrink:0}} />}
              {selectedItem.note && <div>{selectedItem.note}</div>}
            </div>
          );
        })()}
        <button className="btn secondary" onClick={addLine} type="button">+ Aggiungi alla prescrizione</button>
        {lines.length > 0 && (
          <div style={{marginTop:18, marginBottom:16}}>
            {lines.map((l, idx) => (
              <span key={idx} className="device-tag">
                <span className="code-chip">{l.codiceCliente || l.code}</span>{l.descrizionePersonalizzata || l.description}
                <span style={{marginLeft:8, cursor:"pointer", fontWeight:700}} onClick={()=>removeLine(idx)}>×</span>
              </span>
            ))}
          </div>
        )}
        <label>Descrizione del dispositivo</label>
        <textarea value={descrizioneDispositivo} onChange={e=>setDescrizioneDispositivo(e.target.value)} placeholder="Dettagli su misura, indicazioni specifiche..." />
      </div>

      <div className="card">
        <h3>Materiale da utilizzare</h3>
        <div className="row">
          <div>
            <label>Materiale</label>
            <select value={materiale} onChange={e=>setMateriale(e.target.value)}>
              {MATERIALI.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          {materiale === "Altro" && (
            <div><label>Specifica materiale</label><input value={materialeAltro} onChange={e=>setMaterialeAltro(e.target.value)} /></div>
          )}
        </div>
      </div>

      <div className="card">
        <h3>Materiale allegato</h3>
        <div className="checkbox-grid">
          {MATERIALE_ALLEGATO_OPTIONS.map(opt => (
            <div className="checkbox-row" key={opt}>
              <input type="checkbox" checked={materialeAllegato.includes(opt)} onChange={()=>toggleAllegato(opt)} />
              <label style={{margin:0, fontWeight:400, color:"var(--ink)"}}>{opt}</label>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <h3>Impronte</h3>
        <div className="row-auto">
          <div><label>Rilevate il giorno</label><input type="date" value={impronte.data} onChange={e=>setImpronte({...impronte, data:e.target.value})} /></div>
          <div><label>Disinfettate con</label><input value={impronte.disinfettateCon} onChange={e=>setImpronte({...impronte, disinfettateCon:e.target.value})} /></div>
          <div><label>Materiale utilizzato</label><input value={impronte.materialeUtilizzato} onChange={e=>setImpronte({...impronte, materialeUtilizzato:e.target.value})} /></div>
        </div>
      </div>

      <div className="card">
        <h3>Colore</h3>
        <div className="row">
          <div><label>Colore</label><input value={colore} onChange={e=>setColore(e.target.value)} placeholder="Es. A2" /></div>
          <div><label>Campionario</label><input value={campionario} onChange={e=>setCampionario(e.target.value)} placeholder="Es. VITA Classic" /></div>
        </div>
      </div>

      {savedCode && <div className="success">Prescrizione salvata con codice <strong className="mono">{savedCode}</strong>.</div>}

      <div className="actions-row" style={{display:"flex", gap:12}}>
        <button className="btn" onClick={save} disabled={saving}>{saving ? "Salvataggio..." : "Salva prescrizione"}</button>
        <button className="btn secondary" onClick={doPrint} type="button">Stampa / Salva PDF</button>
      </div>

      <PrintablePrescription p={{
        code: savedCode,
        clientHeader: (() => {
          const targetUser = perContoDi ? usersList.find(u => u.id === perContoDi) : null;
          const ownerProfile = targetUser || profile || {};
          return {
            nominativo: ownerProfile.tipoAnagrafica === "azienda"
              ? (ownerProfile.ragioneSociale || "")
              : `${ownerProfile.nome || ""} ${ownerProfile.cognome || ""}`.trim(),
            indirizzo: ownerProfile.indirizzo || "",
            piva: ownerProfile.piva || "",
            telefono: ownerProfile.telefono || "",
            logoDataUrl: ownerProfile.logoDataUrl || "",
          };
        })(),
        patient, teeth, lines,
        anamnesi,
        altreInfo: { eta, sesso, formaViso },
        descrizioneDispositivo,
        materiale: materiale === "Altro" ? materialeAltro : materiale,
        materialeAllegato,
        impronte, colore, campionario,
      }} />
    </div>
  );
}

function AdminCatalog({ catalog, reload }) {
  const categories = [...new Set(catalog.map(i => i.category))];
  const [form, setForm] = useState({ category:"", code:"", description:"", note:"", imageDataUrl:"" });
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const [savingEdit, setSavingEdit] = useState(false);
  const [pendingImport, setPendingImport] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importMsg, setImportMsg] = useState("");

  const addItem = async () => {
    setError("");
    if (!form.category || !form.code || !form.description) return;
    const codeNorm = form.code.trim().toLowerCase();
    if (catalog.some(i => i.code.trim().toLowerCase() === codeNorm)) {
      setError(`Il codice "${form.code}" esiste già nel catalogo. I codici devono essere univoci.`);
      return;
    }
    setSaving(true);
    await db.collection("catalog").add({
      category: form.category, code: form.code, description: form.description,
      note: form.note || "", imageDataUrl: form.imageDataUrl || "",
    });
    setForm({ category:"", code:"", description:"", note:"", imageDataUrl:"" });
    await reload();
    setSaving(false);
  };
  const removeItem = async (id) => { await db.collection("catalog").doc(id).delete(); await reload(); };

  const seed = async () => {
    setSaving(true);
    const batch = db.batch();
    SEED_CATALOG.forEach(item => { const ref = db.collection("catalog").doc(); batch.set(ref, item); });
    await batch.commit();
    await reload();
    setSaving(false);
  };

  const startEdit = (i) => { setEditingId(i.id); setEditForm({ note: i.note || "", imageDataUrl: i.imageDataUrl || "" }); };
  const cancelEdit = () => { setEditingId(null); setEditForm(null); };
  const saveEdit = async (id) => {
    setSavingEdit(true);
    await db.collection("catalog").doc(id).update({ note: editForm.note, imageDataUrl: editForm.imageDataUrl });
    setSavingEdit(false);
    cancelEdit();
    await reload();
  };

  // ---- Import massivo del catalogo da Excel, con anteprima e conferma prima di sovrascrivere ----
  const handleCatalogFileSelect = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImportMsg("");
    try {
      const rows = await parseCatalogExcel(file);
      if (rows.length === 0) {
        setImportMsg("Nessuna riga valida trovata. Il file deve avere le colonne: Categoria, Codice, Descrizione, Nota (opzionale), con la prima riga di intestazioni.");
        return;
      }
      const byCode = new Map(catalog.map(i => [i.code.trim().toLowerCase(), i]));
      const seenInFile = new Set();
      const toAdd = [];
      const toOverwrite = [];
      let duplicatiNelFile = 0;
      rows.forEach(r => {
        const norm = r.code.trim().toLowerCase();
        if (seenInFile.has(norm)) { duplicatiNelFile++; return; }
        seenInFile.add(norm);
        const existing = byCode.get(norm);
        if (existing) {
          toOverwrite.push({ id: existing.id, before: existing, after: r });
        } else {
          toAdd.push(r);
        }
      });
      setPendingImport({ toAdd, toOverwrite, duplicatiNelFile, totale: rows.length });
    } catch (err) {
      setImportMsg("Errore nella lettura del file: " + err.message);
    }
  };

  const cancelImport = () => { setPendingImport(null); };

  const confirmImport = async () => {
    if (!pendingImport) return;
    setImporting(true);
    const { toAdd, toOverwrite } = pendingImport;
    const chunks = (arr, size) => arr.reduce((acc, _, i) => (i % size === 0 ? [...acc, arr.slice(i, i+size)] : acc), []);
    for (const chunk of chunks(toAdd, 400)) {
      const batch = db.batch();
      chunk.forEach(item => {
        const ref = db.collection("catalog").doc();
        batch.set(ref, { category: item.category, code: item.code, description: item.description, note: item.note || "", imageDataUrl: "" });
      });
      await batch.commit();
    }
    for (const chunk of chunks(toOverwrite, 400)) {
      const batch = db.batch();
      chunk.forEach(({ id, after }) => {
        const ref = db.collection("catalog").doc(id);
        const update = { category: after.category, description: after.description };
        if (after.note) update.note = after.note; // non cancella la nota esistente se il file non ne ha una
        batch.update(ref, update);
      });
      await batch.commit();
    }
    setImportMsg(`Import completato: ${toAdd.length} nuove voci aggiunte, ${toOverwrite.length} voci esistenti sovrascritte${pendingImport.duplicatiNelFile ? `, ${pendingImport.duplicatiNelFile} righe scartate per codice duplicato nel file` : ""}.`);
    setPendingImport(null);
    setImporting(false);
    await reload();
  };

  return (
    <div className="card">
      <h3>Catalogo dispositivi</h3>
      <p style={{fontSize:13, color:"var(--muted)", marginTop:-6}}>Codice prodotto e descrizione, nessun prezzo. Ogni codice deve essere univoco. Nota e immagine sono facoltative e aiutano il clinico nella scelta durante la compilazione della prescrizione.</p>
      {error && <div className="error">{error}</div>}
      {catalog.length === 0 && (
        <div className="info">Il catalogo è vuoto. <a style={{cursor:"pointer", fontWeight:600}} onClick={seed}>Inizializza con un catalogo di esempio</a>, poi modifica liberamente le voci.</div>
      )}

      <div className="info">
        <strong>Importa catalogo completo da Excel:</strong> il file deve avere le colonne, in quest'ordine — Categoria, Codice, Descrizione, Nota (opzionale) — con la prima riga di intestazioni (verrà ignorata). Le voci con un codice già esistente nel catalogo verranno <strong>sovrascritte</strong> (categoria e descrizione aggiornate; la nota solo se il file ne contiene una), le altre verranno aggiunte come nuove. Prima di applicare qualsiasi modifica ti verrà mostrata un'anteprima da confermare.
        <div style={{marginTop:8}}>
          <input type="file" accept=".xlsx,.xls,.csv" onChange={handleCatalogFileSelect} disabled={importing || !!pendingImport} />
        </div>
        {importMsg && <div style={{marginTop:6}}>{importMsg}</div>}
      </div>

      {pendingImport && (
        <div className="card" style={{background:"var(--bg)", marginBottom:20}}>
          <h4>Conferma import</h4>
          <p style={{fontSize:13}}>
            Trovate <strong>{pendingImport.totale}</strong> righe nel file.{" "}
            <strong>{pendingImport.toAdd.length}</strong> nuove voci verranno aggiunte,{" "}
            <strong>{pendingImport.toOverwrite.length}</strong> voci esistenti verranno <strong>sovrascritte</strong>
            {pendingImport.duplicatiNelFile > 0 && <> ({pendingImport.duplicatiNelFile} righe scartate per codice duplicato nel file)</>}.
          </p>
          {pendingImport.toOverwrite.length > 0 && (
            <div style={{maxHeight:220, overflowY:"auto", border:"1px solid var(--border)", borderRadius:8, padding:10, marginBottom:14, background:"#fff"}}>
              <table>
                <thead><tr><th>Codice</th><th>Prima</th><th>Dopo</th></tr></thead>
                <tbody>
                  {pendingImport.toOverwrite.map(({ id, before, after }) => (
                    <tr key={id}>
                      <td className="mono">{before.code}</td>
                      <td style={{fontSize:12}}>{before.category} — {before.description}</td>
                      <td style={{fontSize:12, color:"var(--teal-dark)"}}>{after.category} — {after.description}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <div style={{display:"flex", gap:10}}>
            <button className="btn" type="button" onClick={confirmImport} disabled={importing}>{importing ? "Importazione..." : "Conferma e importa"}</button>
            <button className="btn secondary" type="button" onClick={cancelImport} disabled={importing}>Annulla</button>
          </div>
        </div>
      )}

      <div className="row3">
        <div><label>Categoria</label><input list="cat-list" value={form.category} onChange={e=>setForm({...form, category:e.target.value})} placeholder="Es. Protesi fissa" />
          <datalist id="cat-list">{categories.map(c => <option key={c} value={c} />)}</datalist>
        </div>
        <div><label>Codice prodotto</label><input value={form.code} onChange={e=>setForm({...form, code:e.target.value})} placeholder="Es. PF-004" /></div>
        <div><label>Descrizione</label><input value={form.description} onChange={e=>setForm({...form, description:e.target.value})} placeholder="Es. Corona in ceramica" /></div>
      </div>
      <div className="row" style={{marginTop:0}}>
        <div>
          <label>Nota esplicativa (opzionale)</label>
          <textarea value={form.note} onChange={e=>setForm({...form, note:e.target.value})} placeholder="Indicazioni cliniche, quando usarlo, differenze rispetto a dispositivi simili..." />
        </div>
        <div>
          <label>Immagine (opzionale)</label>
          <input type="file" accept="image/*" onChange={e=>handleImageFileUpload(e, dataUrl=>setForm(f=>({...f, imageDataUrl:dataUrl})))} />
          {form.imageDataUrl && (
            <div style={{marginTop:8, display:"flex", alignItems:"center", gap:10}}>
              <img src={form.imageDataUrl} alt="" style={{height:50, borderRadius:4, border:"1px solid var(--border)"}} />
              <button type="button" className="btn danger" onClick={()=>setForm(f=>({...f, imageDataUrl:""}))}>Rimuovi</button>
            </div>
          )}
        </div>
      </div>
      <button className="btn" onClick={addItem} disabled={saving} type="button" style={{marginBottom:18}}>+ Aggiungi</button>
      <table>
        <thead><tr><th></th><th>Categoria</th><th>Codice</th><th>Descrizione</th><th>Nota</th><th></th></tr></thead>
        <tbody>
          {catalog.map(i => (
            <React.Fragment key={i.id}>
              <tr>
                <td>{i.imageDataUrl ? <img src={i.imageDataUrl} alt="" style={{height:32, width:32, objectFit:"cover", borderRadius:4}} /> : null}</td>
                <td>{i.category}</td><td className="mono">{i.code}</td><td>{i.description}</td>
                <td style={{maxWidth:220, fontSize:12, color:"var(--muted)"}}>{i.note ? (i.note.length > 60 ? i.note.slice(0,60)+"…" : i.note) : "—"}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="btn secondary small" type="button" onClick={()=>editingId===i.id ? cancelEdit() : startEdit(i)}>{editingId===i.id ? "Chiudi" : "Modifica"}</button>{" "}
                  <button className="btn danger" onClick={()=>removeItem(i.id)} type="button">Rimuovi</button>
                </td>
              </tr>
              {editingId === i.id && (
                <tr><td colSpan="6">
                  <div className="detail-box">
                    <div style={{marginBottom:12}}>
                      <label>Nota esplicativa</label>
                      <textarea value={editForm.note} onChange={e=>setEditForm({...editForm, note:e.target.value})} />
                    </div>
                    <div>
                      <label>Immagine</label>
                      <input type="file" accept="image/*" onChange={e=>handleImageFileUpload(e, dataUrl=>setEditForm(f=>({...f, imageDataUrl:dataUrl})))} />
                      {editForm.imageDataUrl && (
                        <div style={{marginTop:8, display:"flex", alignItems:"center", gap:10}}>
                          <img src={editForm.imageDataUrl} alt="" style={{height:50, borderRadius:4, border:"1px solid var(--border)"}} />
                          <button type="button" className="btn danger" onClick={()=>setEditForm(f=>({...f, imageDataUrl:""}))}>Rimuovi</button>
                        </div>
                      )}
                    </div>
                    <div style={{display:"flex", gap:10, marginTop:14}}>
                      <button className="btn" type="button" onClick={()=>saveEdit(i.id)} disabled={savingEdit}>{savingEdit ? "Salvataggio..." : "Salva modifiche"}</button>
                      <button className="btn secondary" type="button" onClick={cancelEdit}>Annulla</button>
                    </div>
                  </div>
                </td></tr>
              )}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ============ ADMIN: LISTINI PER CLIENTE (con import Excel) ============
function parseCatalogExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        // Prima riga = intestazioni, colonne: Categoria, Codice, Descrizione, Nota (opzionale)
        const items = rows.slice(1)
          .filter(r => r && String(r[1] || "").trim())
          .map(r => ({
            category: String(r[0] || "").trim(),
            code: String(r[1] || "").trim(),
            description: String(r[2] || "").trim(),
            note: String(r[3] || "").trim(),
          }))
          .filter(r => r.category && r.description);
        resolve(items);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function parseListinoExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        // Prima riga = intestazioni, colonne: Codice, Prezzo, Codice cliente (opzionale), Descrizione personalizzata (opzionale)
        const items = rows.slice(1)
          .filter(r => r && String(r[0] || "").trim())
          .map(r => {
            const priceRaw = r[1];
            const price = priceRaw !== undefined && priceRaw !== "" && !isNaN(parseFloat(priceRaw)) ? parseFloat(priceRaw) : null;
            return {
              code: String(r[0] || "").trim(),
              price,
              codiceCliente: String(r[2] || "").trim(),
              descrizionePersonalizzata: String(r[3] || "").trim(),
            };
          });
        resolve(items);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function AdminListinoDetail({ listino, catalog, onBack }) {
  const [lavorazioni, setLavorazioni] = useState(null);
  const [form, setForm] = useState({ code:"", price:"", codiceCliente:"", descrizionePersonalizzata:"" });
  const [formError, setFormError] = useState("");
  const [saving, setSaving] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [importing, setImporting] = useState(false);
  const [rowEdits, setRowEdits] = useState({});
  const [printData, setPrintData] = useState(null);

  const load = async () => {
    const snap = await db.collection("listini").doc(listino.id).collection("lavorazioni").orderBy("category").get();
    setLavorazioni(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  };
  useEffect(() => { load(); }, [listino.id]);

  useEffect(() => {
    if (printData) {
      const t = setTimeout(() => window.print(), 150);
      return () => clearTimeout(t);
    }
  }, [printData]);
  useEffect(() => {
    const handler = () => setPrintData(null);
    window.addEventListener("afterprint", handler);
    return () => window.removeEventListener("afterprint", handler);
  }, []);

  const findCatalogItem = (code) => catalog.find(c => c.code.trim().toLowerCase() === code.trim().toLowerCase());

  const codiceClienteDuplicato = (codiceCliente, excludeId) => {
    if (!codiceCliente) return false;
    const norm = codiceCliente.trim().toLowerCase();
    return (lavorazioni || []).some(l => l.id !== excludeId && l.codiceCliente && l.codiceCliente.trim().toLowerCase() === norm);
  };

  const addItem = async () => {
    setFormError("");
    if (!form.code) { setFormError("Inserisci un codice."); return; }
    const catalogItem = findCatalogItem(form.code);
    if (!catalogItem) { setFormError(`Il codice "${form.code}" non esiste nel catalogo generico. Aggiungilo prima lì (Amministrazione → Catalogo), poi assegnagli un prezzo qui.`); return; }
    if (lavorazioni && lavorazioni.some(l => l.code.trim().toLowerCase() === form.code.trim().toLowerCase())) {
      setFormError(`Il codice "${form.code}" è già presente in questo listino.`); return;
    }
    if (codiceClienteDuplicato(form.codiceCliente)) {
      setFormError(`Il codice cliente "${form.codiceCliente}" è già assegnato a un'altra lavorazione in questo listino.`); return;
    }
    setSaving(true);
    await db.collection("listini").doc(listino.id).collection("lavorazioni").add({
      category: catalogItem.category, code: catalogItem.code, description: catalogItem.description,
      note: catalogItem.note || "", imageDataUrl: catalogItem.imageDataUrl || "",
      price: form.price !== "" ? parseFloat(form.price) : null,
      codiceCliente: form.codiceCliente.trim(), descrizionePersonalizzata: form.descrizionePersonalizzata.trim(),
    });
    setForm({ code:"", price:"", codiceCliente:"", descrizionePersonalizzata:"" });
    await load();
    setSaving(false);
  };
  const removeItem = async (id) => {
    await db.collection("listini").doc(listino.id).collection("lavorazioni").doc(id).delete();
    load();
  };

  const startRowEdit = (item) => {
    setRowEdits(re => ({ ...re, [item.id]: {
      price: item.price !== null && item.price !== undefined ? String(item.price) : "",
      codiceCliente: item.codiceCliente || "",
      descrizionePersonalizzata: item.descrizionePersonalizzata || "",
      error: "",
    }}));
  };
  const cancelRowEdit = (id) => setRowEdits(re => { const c = {...re}; delete c[id]; return c; });
  const updateRowEdit = (id, field, value) => setRowEdits(re => ({ ...re, [id]: { ...re[id], [field]: value, error:"" } }));

  const saveRowEdit = async (item) => {
    const edit = rowEdits[item.id];
    if (codiceClienteDuplicato(edit.codiceCliente, item.id)) {
      setRowEdits(re => ({ ...re, [item.id]: { ...edit, error: `Il codice cliente "${edit.codiceCliente}" è già assegnato a un'altra lavorazione.` } }));
      return;
    }
    await db.collection("listini").doc(listino.id).collection("lavorazioni").doc(item.id).update({
      price: edit.price !== "" ? parseFloat(edit.price) : null,
      codiceCliente: edit.codiceCliente.trim(),
      descrizionePersonalizzata: edit.descrizionePersonalizzata.trim(),
    });
    cancelRowEdit(item.id);
    load();
  };

  const handleImport = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true); setImportMsg("");
    try {
      const rows = await parseListinoExcel(file);
      if (rows.length === 0) {
        setImportMsg("Nessuna riga valida trovata. Il file deve avere almeno 2 colonne: Codice, Prezzo (prima riga = intestazioni).");
        setImporting(false); e.target.value = ""; return;
      }
      const existingCodes = new Set((lavorazioni || []).map(l => l.code.trim().toLowerCase()));
      const existingCodiciCliente = new Set((lavorazioni || []).filter(l => l.codiceCliente).map(l => l.codiceCliente.trim().toLowerCase()));
      const seenInFile = new Set();
      const seenCodiciClienteInFile = new Set();
      const toImport = [];
      let sconosciuti = 0, duplicati = 0, codiciClienteDuplicati = 0;
      rows.forEach(r => {
        const codeNorm = r.code.trim().toLowerCase();
        const catalogItem = findCatalogItem(r.code);
        if (!catalogItem) { sconosciuti++; return; }
        if (existingCodes.has(codeNorm) || seenInFile.has(codeNorm)) { duplicati++; return; }
        const ccNorm = r.codiceCliente ? r.codiceCliente.trim().toLowerCase() : "";
        if (ccNorm && (existingCodiciCliente.has(ccNorm) || seenCodiciClienteInFile.has(ccNorm))) { codiciClienteDuplicati++; return; }
        seenInFile.add(codeNorm);
        if (ccNorm) seenCodiciClienteInFile.add(ccNorm);
        toImport.push({
          category: catalogItem.category, code: catalogItem.code, description: catalogItem.description, price: r.price,
          note: catalogItem.note || "", imageDataUrl: catalogItem.imageDataUrl || "",
          codiceCliente: r.codiceCliente || "", descrizionePersonalizzata: r.descrizionePersonalizzata || "",
        });
      });
      if (toImport.length > 0) {
        for (let i = 0; i < toImport.length; i += 400) {
          const batch = db.batch();
          toImport.slice(i, i + 400).forEach(item => {
            const ref = db.collection("listini").doc(listino.id).collection("lavorazioni").doc();
            batch.set(ref, item);
          });
          await batch.commit();
        }
      }
      let msg = `Importate ${toImport.length} lavorazioni.`;
      if (sconosciuti > 0) msg += ` ${sconosciuti} righe scartate: codice non presente nel catalogo generico.`;
      if (duplicati > 0) msg += ` ${duplicati} righe scartate: codice duplicato (già nel listino o ripetuto nel file).`;
      if (codiciClienteDuplicati > 0) msg += ` ${codiciClienteDuplicati} righe scartate: codice cliente duplicato.`;
      setImportMsg(msg);
      await load();
    } catch (err) {
      setImportMsg("Errore nella lettura del file: " + err.message);
    }
    setImporting(false);
    e.target.value = "";
  };

  const preparePrint = async () => {
    // Cerca il profilo del cliente associato (stesso codice utente) per l'intestazione
    let clientHeader = { nominativo: listino.nome, indirizzo:"", piva:"", telefono:"", logoDataUrl:"" };
    try {
      const snap = await db.collection("users").where("codiceUtente", "==", listino.codice).limit(1).get();
      if (!snap.empty) {
        const u = snap.docs[0].data();
        clientHeader = {
          nominativo: u.tipoAnagrafica === "azienda" ? (u.ragioneSociale || listino.nome) : `${u.nome||""} ${u.cognome||""}`.trim() || listino.nome,
          indirizzo: u.indirizzo || "", piva: u.piva || "", telefono: u.telefono || "", logoDataUrl: u.logoDataUrl || "",
        };
      }
    } catch (err) { /* usa i valori di default se la ricerca fallisce */ }
    setPrintData({ listino, lavorazioni: lavorazioni || [], clientHeader });
  };

  const matchedPreview = form.code ? findCatalogItem(form.code) : null;

  return (
    <div className="card">
      <button className="link-btn" type="button" onClick={onBack} style={{padding:0, marginBottom:10}}>← Torna ai listini</button>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:10}}>
        <h3>Listino: {listino.nome} <span className="code-chip">{listino.codice}</span></h3>
        <button className="btn secondary" type="button" onClick={preparePrint} disabled={!lavorazioni || lavorazioni.length===0}>Stampa listino</button>
      </div>
      <p style={{fontSize:13, color:"var(--muted)", marginTop:-6}}>
        Ogni lavorazione qui deve corrispondere a un codice già esistente nel catalogo generico — categoria e descrizione interne vengono ereditate da lì. Puoi anche assegnare un <strong>codice cliente</strong> e una <strong>descrizione personalizzata</strong>: se presenti, l'utente con questo listino le vedrà al posto dei tuoi riferimenti interni. Il codice interno non può ripetersi due volte nello stesso listino, e nemmeno il codice cliente.
      </p>

      <div className="info">
        <strong>Importa da Excel:</strong> il file deve avere le colonne, nell'ordine — Codice, Prezzo, Codice cliente, Descrizione personalizzata (solo Codice è obbligatorio, le altre 3 sono opzionali) — con la prima riga di intestazioni (verrà ignorata). Righe con codice sconosciuto o duplicato (interno o cliente) vengono scartate e segnalate.
        <div style={{marginTop:8}}>
          <input type="file" accept=".xlsx,.xls,.csv" onChange={handleImport} disabled={importing} />
        </div>
        {importing && <div style={{marginTop:6}}>Importazione in corso...</div>}
        {importMsg && <div style={{marginTop:6}}>{importMsg}</div>}
      </div>

      <h4 style={{marginTop:20}}>Aggiungi manualmente</h4>
      {formError && <div className="error">{formError}</div>}
      <div className="row-auto">
        <div>
          <label>Codice interno (dal catalogo)</label>
          <input list="catalog-code-list" value={form.code} onChange={e=>setForm({...form, code:e.target.value})} placeholder="Es. PF-001" />
          <datalist id="catalog-code-list">{catalog.map(c => <option key={c.id} value={c.code}>{c.description}</option>)}</datalist>
        </div>
        <div><label>Prezzo € (opzionale)</label><input type="number" value={form.price} onChange={e=>setForm({...form, price:e.target.value})} /></div>
        <div><label>Codice cliente (opzionale)</label><input value={form.codiceCliente} onChange={e=>setForm({...form, codiceCliente:e.target.value})} placeholder="Codice del cliente" /></div>
        <div><label>Descrizione personalizzata (opzionale)</label><input value={form.descrizionePersonalizzata} onChange={e=>setForm({...form, descrizionePersonalizzata:e.target.value})} placeholder="Come la chiama il cliente" /></div>
      </div>
      {matchedPreview && (
        <p style={{fontSize:13, color:"var(--teal-dark)", marginTop:-6}}>Corrisponde a: {matchedPreview.category} — {matchedPreview.description}</p>
      )}
      <button className="btn" onClick={addItem} disabled={saving} type="button" style={{marginBottom:18}}>+ Aggiungi</button>

      {lavorazioni === null ? <div className="empty">Caricamento...</div> : lavorazioni.length === 0 ? (
        <div className="empty">Nessuna lavorazione in questo listino ancora.</div>
      ) : (
        <table>
          <thead><tr><th>Interno</th><th>Codice cliente</th><th>Descrizione cliente</th><th>Prezzo €</th><th></th></tr></thead>
          <tbody>
            {lavorazioni.map(i => {
              const editing = rowEdits[i.id];
              return (
                <tr key={i.id}>
                  <td>
                    <span className="mono">{i.code}</span>
                    <div style={{fontSize:11, color:"var(--muted)"}}>{i.category} — {i.description}</div>
                  </td>
                  {editing ? (
                    <>
                      <td><input value={editing.codiceCliente} onChange={e=>updateRowEdit(i.id, "codiceCliente", e.target.value)} /></td>
                      <td><input value={editing.descrizionePersonalizzata} onChange={e=>updateRowEdit(i.id, "descrizionePersonalizzata", e.target.value)} /></td>
                      <td style={{minWidth:100}}><input type="number" value={editing.price} onChange={e=>updateRowEdit(i.id, "price", e.target.value)} /></td>
                      <td style={{whiteSpace:"nowrap"}}>
                        <button className="btn secondary small" type="button" onClick={()=>saveRowEdit(i)}>Salva</button>{" "}
                        <button className="btn secondary small" type="button" onClick={()=>cancelRowEdit(i.id)}>Annulla</button>
                        {editing.error && <div className="error" style={{marginTop:6, marginBottom:0}}>{editing.error}</div>}
                      </td>
                    </>
                  ) : (
                    <>
                      <td className="mono">{i.codiceCliente || "—"}</td>
                      <td>{i.descrizionePersonalizzata || "—"}</td>
                      <td className="mono">{i.price !== null && i.price !== undefined ? `€ ${Number(i.price).toFixed(2)}` : "—"}</td>
                      <td style={{whiteSpace:"nowrap"}}>
                        <button className="btn secondary small" type="button" onClick={()=>startRowEdit(i)}>Modifica</button>{" "}
                        <button className="btn danger" onClick={()=>removeItem(i.id)} type="button">Rimuovi</button>
                      </td>
                    </>
                  )}
                </tr>
              );
            })}
          </tbody>
        </table>
      )}

      {printData && <PrintableListino data={printData} />}
    </div>
  );
}

function AdminListini({ catalog }) {
  const [listini, setListini] = useState(null);
  const [form, setForm] = useState({ nome:"", codice:"" });
  const [creating, setCreating] = useState(false);
  const [error, setError] = useState("");
  const [selected, setSelected] = useState(null);

  const load = async () => {
    const snap = await db.collection("listini").orderBy("nome").get();
    setListini(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  };
  useEffect(() => { load(); }, []);

  const addListino = async () => {
    setError("");
    if (!form.nome || !form.codice) { setError("Inserisci nome e codice del listino."); return; }
    setCreating(true);
    await db.collection("listini").add({ nome: form.nome, codice: form.codice, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    setForm({ nome:"", codice:"" });
    await load();
    setCreating(false);
  };

  const removeListino = async (l) => {
    if (!window.confirm(`Eliminare il listino "${l.nome}" e tutte le sue lavorazioni?`)) return;
    const snap = await db.collection("listini").doc(l.id).collection("lavorazioni").get();
    const batch = db.batch();
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    await db.collection("listini").doc(l.id).delete();
    load();
  };

  if (selected) return <AdminListinoDetail listino={selected} catalog={catalog} onBack={()=>{ setSelected(null); load(); }} />;

  if (listini === null) return <div className="empty">Caricamento...</div>;
  return (
    <div className="card">
      <h3>Listini per cliente</h3>
      <p style={{fontSize:13, color:"var(--muted)", marginTop:-6}}>
        Da qui in poi il listino di un cliente si crea da solo quando gli assegni un codice utente (in Amministrazione → Utenti). Il modulo qui sotto serve solo per casi particolari: creare un listino "orfano" prima ancora di avere l'utente, o recuperarne uno se per qualche motivo manca.
      </p>
      {error && <div className="error">{error}</div>}
      <div className="row3">
        <div><label>Nome listino</label><input value={form.nome} onChange={e=>setForm({...form, nome:e.target.value})} placeholder="Es. Studio Rossi" /></div>
        <div><label>Codice (uguale al codice utente)</label><input value={form.codice} onChange={e=>setForm({...form, codice:e.target.value})} placeholder="Es. UT-0042" /></div>
        <button className="btn" style={{height:42, alignSelf:"end"}} onClick={addListino} disabled={creating} type="button">+ Crea listino</button>
      </div>
      {listini.length === 0 ? (
        <div className="empty">Nessun listino creato ancora.</div>
      ) : (
        <table>
          <thead><tr><th>Nome</th><th>Codice</th><th></th></tr></thead>
          <tbody>
            {listini.map(l => (
              <tr key={l.id}>
                <td>{l.nome}</td>
                <td className="mono">{l.codice}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="btn secondary small" type="button" onClick={()=>setSelected(l)}>Gestisci lavorazioni</button>{" "}
                  <button className="btn danger" type="button" onClick={()=>removeListino(l)}>Elimina</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function AdminAllPrescriptions() {
  const [items, setItems] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [printItem, setPrintItem] = useState(null);

  const load = async () => {
    const snap = await db.collection("prescriptions").orderBy("createdAt", "desc").get();
    setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  };
  useEffect(() => { load(); }, []);

  useEffect(() => {
    if (printItem) {
      const t = setTimeout(() => window.print(), 150);
      return () => clearTimeout(t);
    }
  }, [printItem]);

  useEffect(() => {
    const handler = () => setPrintItem(null);
    window.addEventListener("afterprint", handler);
    return () => window.removeEventListener("afterprint", handler);
  }, []);

  const removeItem = async (id) => {
    if (!window.confirm("Eliminare definitivamente questa prescrizione?")) return;
    await db.collection("prescriptions").doc(id).delete();
    if (expanded === id) setExpanded(null);
    load();
  };

  if (items === null) return <div className="empty">Caricamento...</div>;
  if (items.length === 0) return <div className="empty">Nessuna prescrizione nel sistema.</div>;
  return (
    <div className="card">
      <h3>Tutte le prescrizioni</h3>
      <table>
        <thead><tr><th>Codice</th><th>Data</th><th>Utente</th><th>Paziente</th><th>Dispositivi</th><th></th></tr></thead>

                <td className="mono">{p.code || "—"}</td>

                  <button className="btn secondary small" type="button" onClick={()=>setPrintItem(p)}>Stampa</button>{" "}
                  <button className="btn danger" type="button" onClick={()=>removeItem(p.id)}>Elimina</button>
                </td>
              </tr>
              {expanded === p.id && (
                <tr><td colSpan="6">
                  <div className="detail-box">
                    <div><b>Anamnesi:</b> {p.anamnesi ? (p.anamnesi.nullaDaSegnalare ? "Nulla da segnalare" : (ANAMNESI_OPTIONS.filter(o=>p.anamnesi[o.key]).map(o=>o.label).join(", ") + (p.anamnesi.note ? " — " + p.anamnesi.note : ""))) : "—"}</div>
                    <div><b>Età/Sesso/Viso:</b> {p.altreInfo ? `${p.altreInfo.eta || "—"} / ${p.altreInfo.sesso || "—"} / ${p.altreInfo.formaViso || "—"}` : "—"}</div>
                    <div><b>Denti:</b> {p.teeth && p.teeth.length ? p.teeth.join(", ") : "—"}</div>
                    <div><b>Descrizione dispositivo:</b> {p.descrizioneDispositivo || "—"}</div>
                    <div><b>Materiale:</b> {p.materiale || "—"}</div>
                    <div><b>Materiale allegato:</b> {p.materialeAllegato && p.materialeAllegato.length ? p.materialeAllegato.join(", ") : "—"}</div>
                    <div><b>Impronte:</b> {p.impronte ? `il ${p.impronte.data || "—"}, disinfettate con ${p.impronte.disinfettateCon || "—"}, materiale ${p.impronte.materialeUtilizzato || "—"}` : "—"}</div>
                    <div><b>Colore:</b> {p.colore || "—"} · <b>Campionario:</b> {p.campionario || "—"}</div>
                  </div>
                </td></tr>
              )}
            </React.Fragment>
          ))}

  );

function itemLabel(i) {
  const code = i.codiceCliente || i.code;
  const desc = i.descrizionePersonalizzata || i.description;
  return `${code} — ${desc}`;
}

function nominativo(u) {
  if (u.tipoAnagrafica === "azienda") return u.ragioneSociale || "—";
  if (u.nome || u.cognome) return `${u.nome || ""} ${u.cognome || ""}`.trim();
  return "—";
}

function handleLogoUpload(e, value, onChange) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 700 * 1024) {
    alert("Il logo è troppo grande (max ~700 KB). Prova a ridurlo o comprimerlo prima di caricarlo.");
    return;
  }
  const reader = new FileReader();
  reader.onload = () => onChange({ ...value, logoDataUrl: reader.result });
  reader.readAsDataURL(file);
}

// Helper generico: carica un'immagine e la passa come data-URL a onLoaded(dataUrl)
function handleImageFileUpload(e, onLoaded, maxKB) {
  const file = e.target.files[0];
  if (!file) return;
  const limit = (maxKB || 700) * 1024;
  if (file.size > limit) {
    alert(`L'immagine è troppo grande (max ~${maxKB || 700} KB). Prova a ridurla o comprimerla prima di caricarla.`);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => onLoaded(reader.result);
  reader.readAsDataURL(file);
}

  return (
    <div>
      <div className="card">
        <h3>Crea nuovo utente</h3>
        {error && <div className="error">{error}</div>}
        {created && (
          <div className="success">
            Utente creato. Comunica queste credenziali a <strong>{created.email}</strong>:<br/>
            Email: <span className="mono">{created.email}</span><br/>
            Password temporanea: <span className="mono">{created.password}</span><br/>
            <small>Consiglia alla persona di cambiarla dopo il primo accesso (menu "Cambia password" in alto).</small>
          </div>
        )}
        <AnagraficaFields value={anagrafica} onChange={setAnagrafica} />
        <div className="row-auto" style={{marginTop:16}}>
          <div><label>Email (credenziale di accesso)</label><input type="email" value={form.email} onChange={e=>setForm({...form, email:e.target.value})} placeholder="collega@esempio.it" /></div>
          <div><label>Codice utente (gestionale)</label><input value={form.codiceUtente} onChange={e=>setForm({...form, codiceUtente:e.target.value})} placeholder="Es. UT-0042" /></div>
          <div>
            <label>Ruolo</label>
            <select value={form.role} onChange={e=>setForm({...form, role:e.target.value})}>
              <option value="user">Utente normale</option>
              <option value="admin">Amministratore</option>
            </select>
          </div>
          <button className="btn" style={{height:42, alignSelf:"end"}} onClick={addUser} disabled={creating} type="button">
            {creating ? "Creazione..." : "+ Crea utente"}
          </button>
        </div>
      </div>

      <div className="card">
        <h3>Utenti registrati</h3>
        <p style={{fontSize:13, color:"var(--muted)", marginTop:-6}}>
          Nominativo e codice utente si modificano liberamente da qui. L'email di accesso non è modificabile dall'app (va cambiata dalla console Firebase, se necessario) — per reimpostare la password, invia l'email di reset qui sotto.
        </p>
        <table>
          <thead><tr><th>Nominativo</th><th>Email</th><th>Codice utente</th><th>Ruolo</th><th></th></tr></thead>
          <tbody>
            {users.map(u => (
              <React.Fragment key={u.id}>
                <tr>
                  <td>{nominativo(u)}</td>
                  <td>{u.email}</td>
                  <td className="mono">{u.codiceUtente || "—"}</td>
                  <td><span className={"role-pill " + (u.role === "admin" ? "admin" : "user")}>{u.role}</span></td>
                  <td style={{whiteSpace:"nowrap"}}>
                    <button className="btn secondary small" type="button" onClick={()=>editingId===u.id ? setEditingId(null) : startEdit(u)}>
                      {editingId===u.id ? "Chiudi" : "Modifica"}
                    </button>{" "}
                    {u.id !== currentUid && (
                      <button className="btn secondary small" onClick={()=>toggleRole(u)} type="button">
                        {u.role === "admin" ? "Rendi utente normale" : "Rendi amministratore"}
                      </button>
                    )}{" "}
                    <button className="btn secondary small" type="button" onClick={()=>sendReset(u)}>Invia email reset password</button>
                    {resetMsg[u.id] && <div style={{fontSize:11, color:"var(--muted)", marginTop:4}}>{resetMsg[u.id]}</div>}
                  </td>
                </tr>
                {editingId === u.id && (
                  <tr><td colSpan="5">
                    <div className="detail-box">
                      <AnagraficaFields value={editForm} onChange={setEditForm} />
                      <div style={{maxWidth:240, marginTop:12}}>
                        <label>Codice utente (gestionale)</label>
                        <input value={editForm.codiceUtente} onChange={e=>setEditForm({...editForm, codiceUtente:e.target.value})} />
                      </div>
                      <div style={{display:"flex", gap:10, marginTop:14}}>
                        <button className="btn" type="button" onClick={saveEdit} disabled={savingEdit}>{savingEdit ? "Salvataggio..." : "Salva modifiche"}</button>
                        <button className="btn secondary" type="button" onClick={()=>setEditingId(null)}>Annulla</button>
                      </div>
                    </div>
                  </td></tr>
                )}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AdminSettings({ settings, reloadSettings }) {
  const [maintenanceMode, setMaintenanceMode] = useState(settings ? !!settings.maintenanceMode : false);
  const [message, setMessage] = useState(settings && settings.maintenanceMessage ? settings.maintenanceMessage : "");
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    setMaintenanceMode(settings ? !!settings.maintenanceMode : false);
    setMessage(settings && settings.maintenanceMessage ? settings.maintenanceMessage : "");
  }, [settings]);

  const save = async (newMode) => {
    setSaving(true); setSaved(false);
    await db.collection("settings").doc("app").set({
      maintenanceMode: newMode !== undefined ? newMode : maintenanceMode,
      maintenanceMessage: message,
    }, { merge: true });
    if (newMode !== undefined) setMaintenanceMode(newMode);
    await reloadSettings();
    setSaving(false); setSaved(true);
    setTimeout(()=>setSaved(false), 2500);
  };

  return (
    <div className="card">
      <h3>Modalità manutenzione</h3>
      <p style={{fontSize:13, color:"var(--muted)", marginTop:-6}}>
        Quando è attiva, tutti gli utenti normali vedono una schermata di manutenzione al posto dell'app. Tu, come amministratore, continui ad accedere normalmente — così puoi lavorare e poi disattivarla quando hai finito.
      </p>
      <div className={maintenanceMode ? "error" : "success"} style={{marginBottom:16}}>
        Stato attuale: <strong>{maintenanceMode ? "Manutenzione ATTIVA — utenti bloccati" : "App regolarmente accessibile"}</strong>
      </div>
      <div style={{marginBottom:16}}>
        <label>Messaggio mostrato agli utenti (opzionale)</label>
        <textarea value={message} onChange={e=>setMessage(e.target.value)} placeholder="Es. Stiamo aggiornando GesPro, torneremo online a breve. Grazie per la pazienza." />
      </div>
      <div style={{display:"flex", gap:10}}>
        {maintenanceMode ? (
          <button className="btn" type="button" onClick={()=>save(false)} disabled={saving}>{saving ? "Attendere..." : "Disattiva manutenzione"}</button>
        ) : (
          <button className="btn danger" style={{background:"var(--danger)", color:"#fff"}} type="button" onClick={()=>save(true)} disabled={saving}>{saving ? "Attendere..." : "Attiva manutenzione"}</button>
        )}
        <button className="btn secondary" type="button" onClick={()=>save()} disabled={saving}>Salva solo il messaggio</button>
      </div>
      {saved && <div className="success" style={{marginTop:14}}>Impostazioni salvate.</div>}
    </div>
  );
}

function AdminPanel({ user, catalog, reloadCatalog, settings, reloadSettings }) {
  const [sub, setSub] = useState("catalogo");
  return (
    <div>
      <div className="tabs" style={{marginBottom:16}}>
        <div className={"tab" + (sub==="catalogo" ? " active" : "")} onClick={()=>setSub("catalogo")}>Catalogo</div>
        <div className={"tab" + (sub==="listini" ? " active" : "")} onClick={()=>setSub("listini")}>Listini</div>
        <div className={"tab" + (sub==="prescrizioni" ? " active" : "")} onClick={()=>setSub("prescrizioni")}>Tutte le prescrizioni</div>
        <div className={"tab" + (sub==="utenti" ? " active" : "")} onClick={()=>setSub("utenti")}>Utenti</div>
        <div className={"tab" + (sub==="impostazioni" ? " active" : "")} onClick={()=>setSub("impostazioni")}>Impostazioni</div>
      </div>
      {sub === "catalogo" && <AdminCatalog catalog={catalog} reload={reloadCatalog} />}
      {sub === "listini" && <AdminListini catalog={catalog} />}
      {sub === "prescrizioni" && <AdminAllPrescriptions />}
      {sub === "utenti" && <AdminUsers currentUid={user.uid} />}
      {sub === "impostazioni" && <AdminSettings settings={settings} reloadSettings={reloadSettings} />}
    </div>
  );
}

function MaintenanceScreen({ message }) {
  return (
    <div className="auth-wrap">
      <div className="auth-card" style={{textAlign:"center"}}>
        <div className="brand" style={{marginBottom:24, justifyContent:"center"}}>
          <div className="brand-mark">G</div>
          <div className="brand-name">GesPro</div>
        </div>
        <h2 style={{fontSize:18}}>App in manutenzione</h2>
        <p style={{fontSize:14, color:"var(--muted)"}}>
          {message && message.trim() ? message : "Stiamo effettuando un intervento di manutenzione. Riprova più tardi."}
        </p>
        <button className="btn secondary" style={{marginTop:10}} onClick={()=>auth.signOut()}>Esci</button>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [tab, setTab] = useState("new");
  const [refreshKey, setRefreshKey] = useState(0);
  const [catalog, setCatalog] = useState([]);
  const [usersList, setUsersList] = useState([]);
  const [showChangePw, setShowChangePw] = useState(false);
  const [settings, setSettings] = useState(null);

  const loadCatalog = async () => {
    const snap = await db.collection("catalog").orderBy("category").get();
    setCatalog(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  };

  const loadUsersList = async () => {
    const snap = await db.collection("users").get();
    setUsersList(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  };

  const loadSettings = async () => {
    const doc = await db.collection("settings").doc("app").get();
    setSettings(doc.exists ? doc.data() : { maintenanceMode: false, maintenanceMessage: "" });
  };

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        const doc = await db.collection("users").doc(u.uid).get();
        const prof = doc.exists ? doc.data() : { role: "user" };
        setProfile(prof);
        loadCatalog();
        loadSettings();
        if (prof.role === "admin") loadUsersList();
      } else {
        setProfile(null);
      }
    });
    return unsub;
  }, []);

  if (user === undefined) return <div className="empty">Caricamento...</div>;
  if (user === null) return <AuthScreen />;

  const isAdmin = profile && profile.role === "admin";

  if (settings === null) return <div className="empty">Caricamento...</div>;
  if (settings.maintenanceMode && !isAdmin) {
    return <MaintenanceScreen message={settings.maintenanceMessage} />;
  }

  return (
    <div>
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">G</div>
          <div className="brand-name">GesPro</div>
          {isAdmin && <span className="badge">Admin</span>}
          {isAdmin && settings.maintenanceMode && <span className="badge" style={{background:"var(--danger)"}}>Manutenzione attiva</span>}
        </div>
        <div className="tabs">
          <div className={"tab" + (tab==="new" ? " active" : "")} onClick={()=>{setTab("new"); setShowChangePw(false);}}>Nuova prescrizione</div>
          <div className={"tab" + (tab==="list" ? " active" : "")} onClick={()=>{setTab("list"); setRefreshKey(k=>k+1); setShowChangePw(false);}}>Elenco prescrizioni</div>
          {isAdmin && <div className={"tab" + (tab==="admin" ? " active" : "")} onClick={()=>{setTab("admin"); setShowChangePw(false);}}>Amministrazione</div>}
        </div>
        <div className="topbar-right">
          <button className="link-btn" onClick={()=>setShowChangePw(v=>!v)}>Cambia password</button>
          <button className="btn secondary" onClick={()=>auth.signOut()}>Esci</button>
        </div>
      </div>
      <div className="container">
        {showChangePw && <ChangePassword onClose={()=>setShowChangePw(false)} />}
        {tab === "new" && <NewPrescription user={user} profile={profile} catalog={catalog} isAdmin={isAdmin} usersList={usersList} onSaved={()=>setRefreshKey(k=>k+1)} />}
        {tab === "list" && <PrescriptionList key={refreshKey} user={user} />}
        {tab === "admin" && isAdmin && <AdminPanel user={user} catalog={catalog} reloadCatalog={loadCatalog} settings={settings} reloadSettings={loadSettings} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
