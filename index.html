function generatePassword() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  let out = "";
  for (let i = 0; i < 10; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

async function createUserAsAdmin(email, password, role) {
  let secondaryApp;
  try {
    secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary-" + Date.now());
    const secondaryAuth = secondaryApp.auth();
    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    await db.collection("users").doc(cred.user.uid).set({
      email, role, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    await secondaryAuth.signOut();
    await secondaryApp.delete();
    return { success: true };
  } catch (err) {
    if (secondaryApp) { try { await secondaryApp.delete(); } catch(e){} }
    return { success: false, error: err.code };
  }
}

// Genera un codice prescrizione univoco e progressivo tipo RX-2026-0001, tramite contatore transazionale
async function generatePrescriptionCode() {
  const year = new Date().getFullYear();
  const counterRef = db.collection("counters").doc("prescriptions_" + year);
  const nextNumber = await db.runTransaction(async (tx) => {
    const doc = await tx.get(counterRef);
    const current = doc.exists ? doc.data().value : 0;
    const next = current + 1;
    tx.set(counterRef, { value: next }, { merge: true });
    return next;
  });
  return "RX-" + year + "-" + String(nextNumber).padStart(4, "0");
}

function traduciErrore(code) {

    "auth/wrong-password": "Password errata.",

    "auth/weak-password": "La password deve avere almeno 6 caratteri.",
    "auth/invalid-credential": "Credenziali non valide.",
  };
  return map[code] || "Si è verificato un errore. Riprova.";
}

// ============ ICONE DENTI (per tipo anatomico) ============
function toothType(n) {
  const pos = n % 10;
  if (pos <= 2) return "incisor";
  if (pos === 3) return "canine";
  if (pos <= 5) return "premolar";
  return "molar";
}

const TOOTH_PATHS = {
  incisor: "M9 3 L15 3 Q17 3 16.5 7 L15.5 18 Q15.2 25 12 25 Q8.8 25 8.5 18 L7.5 7 Q7 3 9 3 Z",
  canine: "M12 2 L17 8 Q18.5 11 16.5 15 L15.5 19 Q15 25 12 25 Q9 25 8.5 19 L7.5 15 Q5.5 11 7 8 Z",
  premolar: "M6.5 8 Q7 3 9.5 5.5 Q11 2.5 12 5 Q13 2.5 14.5 5.5 Q17 3 17.5 8 L16.5 18 Q16 25 12 25 Q8 25 7.5 18 Z",
  molar: "M4 9 Q4.5 3 7 5.5 Q9 2.5 10.5 5 Q12 2.5 13.5 5 Q15 2.5 17 5.5 Q19.5 3 20 9 L19 19 Q18.5 25 12 25 Q5.5 25 5 19 Z",
};

function ToothIcon({ type }) {
  return (
    <svg viewBox="0 0 24 28" xmlns="http://www.w3.org/2000/svg">
      <path className="tooth-shape" d={TOOTH_PATHS[type]} />
    </svg>

}

function DentalChart({ selected, onToggle }) {
  const renderArch = (left, right) => (

      {left.map(n => (
        <button key={n} type="button" className={"tooth-btn" + (selected.includes(n) ? " selected" : "")} onClick={() => onToggle(n)}>

        </button>
      ))}

  return (
    <div className="dental-chart">
      <div className="arch-label">Arcata superiore</div>
      {renderArch(UPPER_RIGHT, UPPER_LEFT)}
      <div className="arch-label" style={{marginTop:14}}>Arcata inferiore</div>

}

function ChangePassword({ onClose }) {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [confirm, setConfirm] = useState("");
  const [error, setError] = useState("");
  const [ok, setOk] = useState(false);
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (next !== confirm) { setError("Le due password non coincidono."); return; }
    setLoading(true);
    try {
      const user = auth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, current);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(next);
      setOk(true);
    } catch (err) {
      setError(traduciErrore(err.code));
    }
    setLoading(false);
  };

  return (
    <div className="card">
      <h3>Cambia password</h3>
      {ok ? (
        <div className="success">Password aggiornata correttamente. <a style={{cursor:"pointer", fontWeight:600}} onClick={onClose}>Chiudi</a></div>
      ) : (
        <form onSubmit={submit}>
          {error && <div className="error">{error}</div>}
          <div style={{maxWidth:300, marginBottom:16}}>
            <label>Password attuale</label><input type="password" value={current} onChange={e=>setCurrent(e.target.value)} required />
          </div>
          <div className="row">
            <div><label>Nuova password</label><input type="password" value={next} onChange={e=>setNext(e.target.value)} required minLength={6} /></div>
            <div><label>Conferma nuova password</label><input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} required minLength={6} /></div>
          </div>
          <div style={{display:"flex", gap:10}}>
            <button className="btn" type="submit" disabled={loading}>{loading ? "Attendere..." : "Aggiorna password"}</button>
            <button className="btn secondary" type="button" onClick={onClose}>Annulla</button>
          </div>
        </form>
      )}
    </div>
  );
}

  }, [category, catalog]);

  const toggleTooth = (n) => setTeeth(t => t.includes(n) ? t.filter(x=>x!==n) : [...t, n].sort((a,b)=>a-b));
  const currentCategoryItems = catalog.filter(i => i.category === category);

  const addLine = () => {
    const item = catalog.find(i => i.category === category && i.code === selectedCode);
    if (item) setLines(l => [...l, { category: item.category, code: item.code, description: item.description }]);
  };
  const removeLine = (idx) => setLines(l => l.filter((_,i)=>i!==idx));

  const toggleAnamnesi = (key) => {
    setAnamnesi(a => {
      if (key === "nullaDaSegnalare") {
        return { ...DEFAULT_ANAMNESI };
      }
      const updated = { ...a, [key]: !a[key], nullaDaSegnalare: false };
      return updated;
    });
  };
  const anamnesiNeedsNote = ANAMNESI_OPTIONS.some(o => anamnesi[o.key]);

  const toggleAllegato = (opt) => {
    setMaterialeAllegato(list => list.includes(opt) ? list.filter(x=>x!==opt) : [...list, opt]);
  };

  const canSave = patient.nome && patient.cognome && lines.length > 0;

  const save = async () => {
    setError("");
    if (!canSave) { setError("Compila nome, cognome paziente e aggiungi almeno un dispositivo."); return; }
    setSaving(true);
    try {
      const code = await generatePrescriptionCode();
      await db.collection("prescriptions").add({
        code, ownerId: user.uid, ownerEmail: user.email,
        patient, teeth, lines,
        anamnesi,
        altreInfo: { eta, sesso, formaViso },
        descrizioneDispositivo,
        materiale: materiale === "Altro" ? materialeAltro : materiale,
        materialeAllegato,
        impronte,
        colore, campionario,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setSavedCode(code);
      onSaved();
    } catch (err) {
      setError("Errore nel salvataggio: " + err.message);
    }
    setSaving(false);
  };

  const doPrint = () => {
    if (!canSave) { setError("Compila nome, cognome paziente e aggiungi almeno un dispositivo prima di stampare."); return; }
    window.print();
  };

  if (catalog.length === 0) {
    return <div className="card"><div className="info">Il catalogo è vuoto. Chiedi a un amministratore di aggiungere i dispositivi nel pannello "Amministrazione".</div></div>;
  }

  return (
    <div>
      <div className="card">
        <h3>Dati paziente</h3>
        {error && <div className="error">{error}</div>}
        <div className="row">
          <div><label>Nome</label><input value={patient.nome} onChange={e=>setPatient({...patient, nome:e.target.value})} /></div>
          <div><label>Cognome</label><input value={patient.cognome} onChange={e=>setPatient({...patient, cognome:e.target.value})} /></div>
        </div>
        <div style={{maxWidth:240}}>
          <label>Data di nascita</label>
          <input type="date" value={patient.dataNascita} onChange={e=>setPatient({...patient, dataNascita:e.target.value})} />
        </div>
      </div>

      <div className="card">
        <h3>Anamnesi</h3>
        <div className="checkbox-row">
          <input type="checkbox" checked={anamnesi.nullaDaSegnalare} onChange={()=>toggleAnamnesi("nullaDaSegnalare")} />
          <label style={{margin:0, fontWeight:700, color:"var(--ink)"}}>Nulla da segnalare</label>
        </div>
        <div className="checkbox-grid">
          {ANAMNESI_OPTIONS.map(o => (
            <div className="checkbox-row" key={o.key}>
              <input type="checkbox" checked={anamnesi[o.key]} onChange={()=>toggleAnamnesi(o.key)} />
              <label style={{margin:0, fontWeight:400, color:"var(--ink)"}}>{o.label}</label>
            </div>
          ))}
        </div>
        {anamnesiNeedsNote && (
          <div style={{marginTop:10}}>
            <label>Specifica</label>
            <textarea value={anamnesi.note} onChange={e=>setAnamnesi({...anamnesi, note:e.target.value})} placeholder="Dettagli su quanto selezionato sopra..." />
          </div>
        )}
      </div>

      <div className="card">
        <h3>Altre informazioni</h3>
        <div className="row-auto">
          <div><label>Età</label><input type="number" min="0" value={eta} onChange={e=>setEta(e.target.value)} /></div>
          <div>
            <label>Sesso</label>
            <div style={{display:"flex", gap:8}}>
              <button type="button" className={"btn " + (sesso==="M" ? "" : "secondary")} onClick={()=>setSesso("M")} style={{flex:1}}>M</button>
              <button type="button" className={"btn " + (sesso==="F" ? "" : "secondary")} onClick={()=>setSesso("F")} style={{flex:1}}>F</button>
            </div>
          </div>
        </div>
        <label>Forma del viso</label>
        <div className="icon-choice-group">
          {["quadrato","tondo","triangolare"].map(shape => (
            <div key={shape} className={"icon-choice" + (formaViso===shape ? " selected" : "")} onClick={()=>setFormaViso(shape)}>
              <FaceIcon shape={shape} />
              {shape}
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <h3>Schema dentale</h3>
        <p style={{fontSize:13, color:"var(--muted)", marginTop:0}}>Seleziona i denti coinvolti (numerazione FDI/ISO).</p>
        <DentalChart selected={teeth} onToggle={toggleTooth} />
      </div>

      <div className="card">
        <h3>Dispositivo da realizzare</h3>
        <div className="row">
          <div>
            <label>Categoria</label>
            <select value={category} onChange={e=>setCategory(e.target.value)}>
              {categories.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label>Dispositivo</label>
            <select value={selectedCode} onChange={e=>setSelectedCode(e.target.value)}>
              {currentCategoryItems.map(i => <option key={i.id} value={i.code}>{i.code} — {i.description}</option>)}
            </select>
          </div>
        </div>
        <button className="btn secondary" onClick={addLine} type="button">+ Aggiungi alla prescrizione</button>
        {lines.length > 0 && (
          <div style={{marginTop:18, marginBottom:16}}>
            {lines.map((l, idx) => (
              <span key={idx} className="device-tag">
                <span className="code-chip">{l.code}</span>{l.description}
                <span style={{marginLeft:8, cursor:"pointer", fontWeight:700}} onClick={()=>removeLine(idx)}>×</span>
              </span>
            ))}
          </div>
        )}
        <label>Descrizione del dispositivo</label>
        <textarea value={descrizioneDispositivo} onChange={e=>setDescrizioneDispositivo(e.target.value)} placeholder="Dettagli su misura, indicazioni specifiche..." />
      </div>

      <div className="card">
        <h3>Materiale da utilizzare</h3>
        <div className="row">
          <div>
            <label>Materiale</label>
            <select value={materiale} onChange={e=>setMateriale(e.target.value)}>
              {MATERIALI.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          {materiale === "Altro" && (
            <div><label>Specifica materiale</label><input value={materialeAltro} onChange={e=>setMaterialeAltro(e.target.value)} /></div>
          )}
        </div>
      </div>

      <div className="card">
        <h3>Materiale allegato</h3>
        <div className="checkbox-grid">
          {MATERIALE_ALLEGATO_OPTIONS.map(opt => (
            <div className="checkbox-row" key={opt}>
              <input type="checkbox" checked={materialeAllegato.includes(opt)} onChange={()=>toggleAllegato(opt)} />
              <label style={{margin:0, fontWeight:400, color:"var(--ink)"}}>{opt}</label>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <h3>Impronte</h3>
        <div className="row-auto">
          <div><label>Rilevate il giorno</label><input type="date" value={impronte.data} onChange={e=>setImpronte({...impronte, data:e.target.value})} /></div>
          <div><label>Disinfettate con</label><input value={impronte.disinfettateCon} onChange={e=>setImpronte({...impronte, disinfettateCon:e.target.value})} /></div>
          <div><label>Materiale utilizzato</label><input value={impronte.materialeUtilizzato} onChange={e=>setImpronte({...impronte, materialeUtilizzato:e.target.value})} /></div>
        </div>
      </div>

      <div className="card">
        <h3>Colore</h3>
        <div className="row">
          <div><label>Colore</label><input value={colore} onChange={e=>setColore(e.target.value)} placeholder="Es. A2" /></div>
          <div><label>Campionario</label><input value={campionario} onChange={e=>setCampionario(e.target.value)} placeholder="Es. VITA Classic" /></div>
        </div>
      </div>

      {savedCode && <div className="success">Prescrizione salvata con codice <strong className="mono">{savedCode}</strong>.</div>}

      <div style={{display:"flex", gap:12}}>
        <button className="btn" onClick={save} disabled={saving}>{saving ? "Salvataggio..." : "Salva prescrizione"}</button>
        <button className="btn secondary" onClick={doPrint} type="button">Stampa / Salva PDF</button>
      </div>

      <div className="print-area">
        <div className="print-header">
          <div><h2 style={{margin:0, fontSize:18}}>GesPro</h2><div style={{fontSize:10, color:"#555"}}>Prescrizione per laboratorio odontotecnico</div></div>
          <div style={{fontSize:11, textAlign:"right"}}>
            {savedCode && <div><strong>{savedCode}</strong></div>}
            <div>{new Date().toLocaleDateString("it-IT")}</div>
          </div>
        </div>
        <div className="print-columns">
          <div className="print-col">
            <div className="print-section">
              <h5>Paziente</h5>
              <div>{patient.nome} {patient.cognome}{patient.dataNascita ? " — nato/a il " + new Date(patient.dataNascita).toLocaleDateString("it-IT") : ""}</div>
              <div>Età: {eta || "—"} · Sesso: {sesso || "—"} · Forma viso: {formaViso || "—"}</div>
            </div>
            <div className="print-section">
              <h5>Anamnesi</h5>
              {anamnesi.nullaDaSegnalare ? "Nulla da segnalare" : (
                <div>
                  {ANAMNESI_OPTIONS.filter(o=>anamnesi[o.key]).map(o=>o.label).join(", ")}
                  {anamnesi.note && <div style={{marginTop:4}}><em>{anamnesi.note}</em></div>}
                </div>
              )}
            </div>
            <div className="print-section">
              <h5>Denti coinvolti</h5>
              <div className="print-teeth">
                {teeth.length ? teeth.map(t => <div key={t} className="print-tooth">{t}</div>) : <em>Nessuno</em>}
              </div>
            </div>
            <div className="print-section">
              <h5>Dispositivo richiesto</h5>
              <ul style={{margin:0, paddingLeft:16}}>
                {lines.map((l, idx) => (<li key={idx}>{l.code} — {l.description}</li>))}
              </ul>
              {descrizioneDispositivo && <div style={{marginTop:4}}>{descrizioneDispositivo}</div>}
            </div>
            <div className="print-section">
              <h5>Materiale</h5>
              <div>{materiale === "Altro" ? materialeAltro : materiale}</div>
            </div>
            <div className="print-section">
              <h5>Materiale allegato</h5>
              <div>{materialeAllegato.length ? materialeAllegato.join(", ") : "—"}</div>
            </div>
            <div className="print-section">
              <h5>Impronte</h5>
              <div>Rilevate il: {impronte.data ? new Date(impronte.data).toLocaleDateString("it-IT") : "—"}</div>
              <div>Disinfettate con: {impronte.disinfettateCon || "—"}</div>
              <div>Materiale: {impronte.materialeUtilizzato || "—"}</div>
            </div>
            <div className="print-section">
              <h5>Colore</h5>
              <div>Colore: {colore || "—"} · Campionario: {campionario || "—"}</div>
            </div>
          </div>
          <div className="print-col">
            <div className="print-section">
              <h5>Modulo delle prove</h5>
              <table className="trial-table">
                <thead><tr><th>Data prova</th><th>Esito / Note</th><th>Firma</th></tr></thead>
                <tbody>
                  <tr><td></td><td></td><td></td></tr>
                  <tr><td></td><td></td><td></td></tr>
                  <tr><td></td><td></td><td></td></tr>
                  <tr><td></td><td></td><td></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function PrescriptionList({ user }) {
  const [items, setItems] = useState(null);
  const [error, setError] = useState("");
  useEffect(() => {
    // Nota: niente orderBy nella query, per evitare di dover creare un indice composito su Firestore.
    // L'ordinamento per data viene fatto qui lato app.
    db.collection("prescriptions").where("ownerId", "==", user.uid).get()
      .then(snap => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => (b.createdAt ? b.createdAt.seconds : 0) - (a.createdAt ? a.createdAt.seconds : 0));
        setItems(list);
      })
      .catch(err => setError("Errore nel caricamento: " + err.message));
  }, []);
  if (error) return <div className="error">{error}</div>;
  if (items === null) return <div className="empty">Caricamento...</div>;
  if (items.length === 0) return <div className="empty">Nessuna prescrizione ancora salvata.</div>;
  return (
    <div className="card">
      <table>
        <thead><tr><th>Codice</th><th>Data</th><th>Paziente</th><th>Dispositivi</th></tr></thead>
        <tbody>
          {items.map(p => (
            <tr key={p.id}>
              <td className="mono">{p.code || "—"}</td>
              <td>{p.createdAt ? new Date(p.createdAt.seconds*1000).toLocaleDateString("it-IT") : "—"}</td>
              <td>{p.patient.nome} {p.patient.cognome}</td>
              <td>{p.lines.map(l=>l.code).join(", ")}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ============ ADMIN: CATALOGO ============
function AdminCatalog({ catalog, reload }) {
  const categories = [...new Set(catalog.map(i => i.category))];
  const [form, setForm] = useState({ category:"", code:"", description:"" });
  const [saving, setSaving] = useState(false);

  const addItem = async () => {
    if (!form.category || !form.code || !form.description) return;
    setSaving(true);
    await db.collection("catalog").add({ category: form.category, code: form.code, description: form.description });
    setForm({ category:"", code:"", description:"" });
    await reload();
    setSaving(false);
  };
  const removeItem = async (id) => { await db.collection("catalog").doc(id).delete(); await reload(); };

  const seed = async () => {
    setSaving(true);
    const batch = db.batch();
    SEED_CATALOG.forEach(item => { const ref = db.collection("catalog").doc(); batch.set(ref, item); });
    await batch.commit();
    await reload();
    setSaving(false);
  };

  return (
    <div className="card">
      <h3>Catalogo dispositivi</h3>
      <p style={{fontSize:13, color:"var(--muted)", marginTop:-6}}>Codice prodotto e descrizione, nessun prezzo.</p>
      {catalog.length === 0 && (
        <div className="info">Il catalogo è vuoto. <a style={{cursor:"pointer", fontWeight:600}} onClick={seed}>Inizializza con un catalogo di esempio</a>, poi modifica liberamente le voci.</div>
      )}
      <div className="row3">
        <div><label>Categoria</label><input list="cat-list" value={form.category} onChange={e=>setForm({...form, category:e.target.value})} placeholder="Es. Protesi fissa" />
          <datalist id="cat-list">{categories.map(c => <option key={c} value={c} />)}</datalist>
        </div>
        <div><label>Codice prodotto</label><input value={form.code} onChange={e=>setForm({...form, code:e.target.value})} placeholder="Es. PF-004" /></div>
        <div><label>Descrizione</label><input value={form.description} onChange={e=>setForm({...form, description:e.target.value})} placeholder="Es. Corona in ceramica" /></div>
      </div>
      <button className="btn" onClick={addItem} disabled={saving} type="button" style={{marginBottom:18}}>+ Aggiungi</button>
      <table>
        <thead><tr><th>Categoria</th><th>Codice</th><th>Descrizione</th><th></th></tr></thead>
        <tbody>
          {catalog.map(i => (
            <tr key={i.id}>
              <td>{i.category}</td><td className="mono">{i.code}</td><td>{i.description}</td>
              <td><button className="btn danger" onClick={()=>removeItem(i.id)} type="button">Rimuovi</button></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ============ ADMIN: PRESCRIZIONI (visualizza / elimina) ============
function AdminAllPrescriptions() {
  const [items, setItems] = useState(null);
  const [expanded, setExpanded] = useState(null);

  const load = async () => {
    const snap = await db.collection("prescriptions").orderBy("createdAt", "desc").get();
    setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  };
  useEffect(() => { load(); }, []);

  const removeItem = async (id) => {
    if (!window.confirm("Eliminare definitivamente questa prescrizione?")) return;
    await db.collection("prescriptions").doc(id).delete();
    if (expanded === id) setExpanded(null);
    load();
  };

  if (items === null) return <div className="empty">Caricamento...</div>;
  if (items.length === 0) return <div className="empty">Nessuna prescrizione nel sistema.</div>;
  return (
    <div className="card">
      <h3>Tutte le prescrizioni</h3>
      <table>
        <thead><tr><th>Codice</th><th>Data</th><th>Utente</th><th>Paziente</th><th>Dispositivi</th><th></th></tr></thead>
        <tbody>
          {items.map(p => (
            <React.Fragment key={p.id}>
              <tr>
                <td className="mono">{p.code || "—"}</td>
                <td>{p.createdAt ? new Date(p.createdAt.seconds*1000).toLocaleDateString("it-IT") : "—"}</td>
                <td>{p.ownerEmail}</td>
                <td>{p.patient.nome} {p.patient.cognome}</td>
                <td>{p.lines.map(l=>l.code).join(", ")}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="btn secondary small" type="button" onClick={()=>setExpanded(expanded===p.id ? null : p.id)}>{expanded===p.id ? "Chiudi" : "Dettaglio"}</button>{" "}
                  <button className="btn danger" type="button" onClick={()=>removeItem(p.id)}>Elimina</button>
                </td>
              </tr>
              {expanded === p.id && (
                <tr><td colSpan="6">
                  <div className="detail-box">
                    <div><b>Anamnesi:</b> {p.anamnesi ? (p.anamnesi.nullaDaSegnalare ? "Nulla da segnalare" : (ANAMNESI_OPTIONS.filter(o=>p.anamnesi[o.key]).map(o=>o.label).join(", ") + (p.anamnesi.note ? " — " + p.anamnesi.note : ""))) : "—"}</div>
                    <div><b>Età/Sesso/Viso:</b> {p.altreInfo ? `${p.altreInfo.eta || "—"} / ${p.altreInfo.sesso || "—"} / ${p.altreInfo.formaViso || "—"}` : "—"}</div>
                    <div><b>Denti:</b> {p.teeth && p.teeth.length ? p.teeth.join(", ") : "—"}</div>
                    <div><b>Descrizione dispositivo:</b> {p.descrizioneDispositivo || "—"}</div>
                    <div><b>Materiale:</b> {p.materiale || "—"}</div>
                    <div><b>Materiale allegato:</b> {p.materialeAllegato && p.materialeAllegato.length ? p.materialeAllegato.join(", ") : "—"}</div>
                    <div><b>Impronte:</b> {p.impronte ? `il ${p.impronte.data || "—"}, disinfettate con ${p.impronte.disinfettateCon || "—"}, materiale ${p.impronte.materialeUtilizzato || "—"}` : "—"}</div>
                    <div><b>Colore:</b> {p.colore || "—"} · <b>Campionario:</b> {p.campionario || "—"}</div>
                  </div>
                </td></tr>
              )}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ============ ADMIN: UTENTI ============
function AdminUsers({ currentUid }) {
  const [users, setUsers] = useState(null);
  const [form, setForm] = useState({ email:"", role:"user" });
  const [creating, setCreating] = useState(false);
  const [error, setError] = useState("");
  const [created, setCreated] = useState(null);
  const [resetMsg, setResetMsg] = useState({});

  const load = async () => {
    const snap = await db.collection("users").orderBy("createdAt", "desc").get();
    setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  };
  useEffect(() => { load(); }, []);

  const toggleRole = async (u) => {
    const newRole = u.role === "admin" ? "user" : "admin";
    await db.collection("users").doc(u.id).update({ role: newRole });
    load();
  };

  const addUser = async () => {
    setError(""); setCreated(null);
    if (!form.email) { setError("Inserisci un'email."); return; }
    setCreating(true);
    const password = generatePassword();
    const result = await createUserAsAdmin(form.email, password, form.role);
    if (result.success) {
      setCreated({ email: form.email, password });
      setForm({ email:"", role:"user" });
      load();
    } else {
      setError(traduciErrore(result.error));
    }
    setCreating(false);
  };

  const sendReset = async (u) => {
    try {
      await auth.sendPasswordResetEmail(u.email);
      setResetMsg(m => ({ ...m, [u.id]: "Email inviata." }));
    } catch (err) {
      setResetMsg(m => ({ ...m, [u.id]: "Errore: " + traduciErrore(err.code) }));
    }
  };

  if (users === null) return <div className="empty">Caricamento...</div>;
  return (
    <div>
      <div className="card">
        <h3>Crea nuovo utente</h3>
        {error && <div className="error">{error}</div>}
        {created && (
          <div className="success">
            Utente creato. Comunica queste credenziali a <strong>{created.email}</strong>:<br/>
            Email: <span className="mono">{created.email}</span><br/>
            Password temporanea: <span className="mono">{created.password}</span><br/>
            <small>Consiglia alla persona di cambiarla dopo il primo accesso (menu "Cambia password" in alto).</small>
          </div>
        )}
        <div className="row3">
          <div><label>Email</label><input type="email" value={form.email} onChange={e=>setForm({...form, email:e.target.value})} placeholder="collega@esempio.it" /></div>
          <div>
            <label>Ruolo</label>
            <select value={form.role} onChange={e=>setForm({...form, role:e.target.value})}>
              <option value="user">Utente normale</option>
              <option value="admin">Amministratore</option>
            </select>
          </div>
          <button className="btn" style={{height:42, alignSelf:"end"}} onClick={addUser} disabled={creating} type="button">
            {creating ? "Creazione..." : "+ Crea utente"}
          </button>
        </div>
      </div>

      <div className="card">
        <h3>Utenti registrati</h3>
        <p style={{fontSize:13, color:"var(--muted)", marginTop:-6}}>
          Per reimpostare la password di un utente esistente, invia l'email di reset: la persona riceverà un link per sceglierne una nuova.
        </p>
        <table>
          <thead><tr><th>Email</th><th>Ruolo</th><th>Registrato il</th><th></th></tr></thead>
          <tbody>
            {users.map(u => (
              <tr key={u.id}>
                <td>{u.email}</td>
                <td><span className={"role-pill " + (u.role === "admin" ? "admin" : "user")}>{u.role}</span></td>
                <td>{u.createdAt ? new Date(u.createdAt.seconds*1000).toLocaleDateString("it-IT") : "—"}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  {u.id !== currentUid && (
                    <button className="btn secondary small" onClick={()=>toggleRole(u)} type="button">
                      {u.role === "admin" ? "Rendi utente normale" : "Rendi amministratore"}
                    </button>
                  )}{" "}
                  <button className="btn secondary small" type="button" onClick={()=>sendReset(u)}>Invia email reset password</button>
                  {resetMsg[u.id] && <div style={{fontSize:11, color:"var(--muted)", marginTop:4}}>{resetMsg[u.id]}</div>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AdminPanel({ user, catalog, reloadCatalog }) {
  const [sub, setSub] = useState("catalogo");
  return (
    <div>
      <div className="tabs" style={{marginBottom:16}}>
        <div className={"tab" + (sub==="catalogo" ? " active" : "")} onClick={()=>setSub("catalogo")}>Catalogo</div>
        <div className={"tab" + (sub==="prescrizioni" ? " active" : "")} onClick={()=>setSub("prescrizioni")}>Tutte le prescrizioni</div>
        <div className={"tab" + (sub==="utenti" ? " active" : "")} onClick={()=>setSub("utenti")}>Utenti</div>
      </div>
      {sub === "catalogo" && <AdminCatalog catalog={catalog} reload={reloadCatalog} />}
      {sub === "prescrizioni" && <AdminAllPrescriptions />}
      {sub === "utenti" && <AdminUsers currentUid={user.uid} />}
    </div>
  );
}

function App() {
  const [user, setUser] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [tab, setTab] = useState("new");
  const [refreshKey, setRefreshKey] = useState(0);
  const [catalog, setCatalog] = useState([]);
  const [showChangePw, setShowChangePw] = useState(false);

  const loadCatalog = async () => {
    const snap = await db.collection("catalog").orderBy("category").get();
    setCatalog(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  };

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        const doc = await db.collection("users").doc(u.uid).get();
        setProfile(doc.exists ? doc.data() : { role: "user" });
        loadCatalog();
      } else {
        setProfile(null);
      }
    });
    return unsub;
  }, []);

  if (user === undefined) return <div className="empty">Caricamento...</div>;
  if (user === null) return <AuthScreen />;

  const isAdmin = profile && profile.role === "admin";

  return (
    <div>
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">G</div>
          <div className="brand-name">GesPro</div>
          {isAdmin && <span className="badge">Admin</span>}
        </div>
        <div className="tabs">
          <div className={"tab" + (tab==="new" ? " active" : "")} onClick={()=>{setTab("new"); setShowChangePw(false);}}>Nuova prescrizione</div>
          <div className={"tab" + (tab==="list" ? " active" : "")} onClick={()=>{setTab("list"); setRefreshKey(k=>k+1); setShowChangePw(false);}}>Elenco prescrizioni</div>
          {isAdmin && <div className={"tab" + (tab==="admin" ? " active" : "")} onClick={()=>{setTab("admin"); setShowChangePw(false);}}>Amministrazione</div>}
        </div>
        <div className="topbar-right">
          <button className="link-btn" onClick={()=>setShowChangePw(v=>!v)}>Cambia password</button>
          <button className="btn secondary" onClick={()=>auth.signOut()}>Esci</button>
        </div>
      </div>
      <div className="container">
        {showChangePw && <ChangePassword onClose={()=>setShowChangePw(false)} />}
        {tab === "new" && <NewPrescription user={user} catalog={catalog} onSaved={()=>setRefreshKey(k=>k+1)} />}
        {tab === "list" && <PrescriptionList key={refreshKey} user={user} />}
        {tab === "admin" && isAdmin && <AdminPanel user={user} catalog={catalog} reloadCatalog={loadCatalog} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
